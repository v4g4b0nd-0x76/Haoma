<!doctype html>
<html lang="{{ site.Language.LanguageCode }}" dir="{{ site.Language.LanguageDirection | default "ltr" }}" data-culture="{{ .Params.culture | default "base" }}"{{ if .Params.culture }} data-fixed="1"{{ end }}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{ partial "head-seo.html" . }}
<link rel="icon" href="{{ "img/brand/favicon.svg" | relURL }}" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="32x32" href="{{ "img/brand/favicon-32.png" | relURL }}">
<link rel="icon" type="image/png" sizes="192x192" href="{{ "img/brand/favicon-192.png" | relURL }}">
<link rel="apple-touch-icon" href="{{ "img/brand/apple-touch-icon.png" | relURL }}">
<meta name="theme-color" content="#14161a">
<script src="{{ "js/boot.js" | relURL }}"></script>
<link rel="stylesheet" href="{{ printf "%s?v=atlas-noselect-1" ("css/style.css" | relURL) }}">
<style>{{ range $k, $t := site.Data.themes }}[data-culture="{{ $k }}"]{--accent:{{ $t.accent | safeCSS }};--bg:{{ $t.bg | safeCSS }};--surface:{{ $t.surface | safeCSS }};--border:{{ $t.border | safeCSS }};--text:{{ $t.text | safeCSS }};--muted:{{ $t.muted | safeCSS }};--anim:{{ $t.anim | default "none" | safeCSS }};--meander:var(--m-{{ $t.pattern | default "none" | safeCSS }});--rune:{{ printf "%q" ($t.glyphs | default "") | safeCSS }}}
{{ end }}</style>
<link rel="preload" href="{{ "fonts/iransans-400.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>
{{ range .AlternativeOutputFormats }}<link rel="{{ .Rel }}" type="{{ .MediaType.Type }}" href="{{ .Permalink }}">{{ end }}
</head>
<body>
<div class="bg"></div>
<header class="top">
  <a class="brand" href="{{ site.Home.RelPermalink }}">{{ partial "logo.html" (dict "v" "word" "id" "h") }}</a>
  <nav>{{ range index site.Data.nav site.Language.Lang }}<a href="{{ .url | relLangURL }}">{{ .name }}</a>{{ end }}</nav>
  <div class="ctrl">
    {{- /* culture picker: a listbox rather than a <select>, because a native one
           cannot show the culture's own colour while you hover its option.
           Each option carries that culture's --c (its main colour) and --pat (its
           motif); the wrapper holds the colour of the culture currently in force,
           which is what tints the trigger and the panel frame. */ -}}
    <div class="cpick" id="culture-pick" style="--c:#9aa3b5;--pat:var(--m-star)">
      <button type="button" class="cpick__btn" id="cpick-btn" aria-haspopup="listbox" aria-expanded="false" aria-controls="cpick-list" aria-label="{{ i18n "pickLabel" }}"><span class="cpick__sig" aria-hidden="true"></span><span class="cpick__name"></span><span class="cpick__chev" aria-hidden="true"></span></button>
      <ul class="cpick__list" id="cpick-list" role="listbox" aria-labelledby="cpick-btn" hidden>
        {{- /* the general box: neutral, star-marked, listed on its own above the cultures */ -}}
        <li class="cpick__opt cpick__opt--all" role="option" data-pick="base" data-name="{{ i18n "all" }}" data-href="{{ (site.GetPage "/cultures").RelPermalink }}" style="--c:#9aa3b5;--pat:var(--m-star)" aria-selected="false"><span class="cpick__sig" aria-hidden="true"></span><span class="cpick__name">{{ i18n "all" }}</span><span class="cpick__dot" aria-hidden="true"></span></li>
        {{ range (site.GetPage "/cultures").Sections }}{{ $t := index site.Data.themes .Params.culture | default dict }}<li class="cpick__opt" role="option" data-pick="{{ .Params.culture }}" data-name="{{ .Title }}" data-href="{{ .RelPermalink }}" style="--c:{{ $t.accent | default "#9aa3b5" | safeCSS }};--pat:var(--m-{{ $t.pattern | default "none" | safeCSS }})" aria-selected="false"><span class="cpick__sig" aria-hidden="true"></span><span class="cpick__name">{{ .Title }}</span><span class="cpick__dot" aria-hidden="true"></span></li>{{ end }}
      </ul>
    </div>
    {{ $t := .Translations }}{{ if not $t }}{{ $t = site.Home.Translations }}{{ end }}
    {{ range $t }}<a class="lang" href="{{ .RelPermalink }}" hreflang="{{ .Language.Lang }}" lang="{{ .Language.Lang }}">{{ .Language.LanguageName }}</a>{{ end }}
  </div>
</header>
<div class="motif"></div>
{{ with .Params.culture }}{{ $b := (index site.Data.themes . | default dict).banner }}{{ if $b }}
<div class="hero-art c-{{ . }}"><img class="sbg" src="{{ printf "img/%s" $b | relURL }}" alt="" aria-hidden="true"><img class="sfg" src="{{ printf "img/%s" $b | relURL }}" alt="{{ $.Params.culture }} banner art"></div>
{{ end }}{{ end }}
<main>{{ block "main" . }}{{ end }}</main>
<footer>{{ i18n "textLabel" }} CC BY-SA · {{ i18n "codeLabel" }} MIT{{ with site.Home.OutputFormats.Get "rss" }} · <a href="{{ .RelPermalink }}">RSS</a>{{ end }} · <a href="{{ "about/" | relLangURL }}">{{ i18n "sources" }}</a></footer>
<script src="{{ printf "%s?v=hero-preview-5" ("js/site.js" | relURL) }}"></script>
{{ if and .Params.culture (not .Params.sec) }}<script src="{{ printf "%s?v=atlas-space-1" ("js/mindmap.js" | relURL) }}"></script>{{ end }}
</body>
</html>
