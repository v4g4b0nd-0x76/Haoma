<div class="tools" role="toolbar">
<button type="button" data-act="nav" title="{{ i18n "tNav" }}">☰</button>
<button type="button" data-act="dock" title="{{ i18n "tDock" }}">⇄</button>
<button type="button" data-act="minus" title="{{ i18n "tSmaller" }}">A−</button>
<button type="button" data-act="plus" title="{{ i18n "tBigger" }}">A+</button>
<button type="button" data-act="focus" title="{{ i18n "tFocus" }}">◐</button>
{{- /* PDF export: the page's own theme is what gets printed, so the reader's
       "Save as PDF" produces a themed file. See the print block in style.css. */ -}}
<button type="button" class="tools__pdf" data-act="pdf" title="{{ i18n "exportPdfHint" }}" aria-label="{{ i18n "exportPdf" }}">{{ i18n "exportPdf" }}</button>
</div>
