{{ $src := .Get "src" }}{{ $u := $src | relURL }}{{ $ext := lower (path.Ext $src) }}
{{ if in (slice ".mp3" ".ogg" ".wav" ".m4a") $ext }}<audio controls preload="none" src="{{ $u }}"></audio>
{{ else if in (slice ".mp4" ".webm") $ext }}<video controls preload="metadata" src="{{ $u }}" style="width:100%"></video>
{{ else if eq $ext ".pdf" }}<embed src="{{ $u }}" type="application/pdf" style="width:100%;height:70vh"><p><a href="{{ $u }}">PDF</a></p>
{{ else }}<a href="{{ $u }}">{{ .Get "title" | default $src }}</a>{{ end }}
