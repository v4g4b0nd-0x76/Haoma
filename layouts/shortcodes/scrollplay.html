{{- $a := .Get "align" | default "full" -}}
<figure class="fig sp {{ $a }}"{{ with .Get "w" }}{{ if findRE `^[0-9]{1,3}(%|px|rem)$` . }} style="{{ printf "--w:%s" . | safeCSS }}"{{ end }}{{ end }}>{{ partial "mediaitem.html" (dict "src" (.Get "src") "cap" (.Get "caption")) }}{{ with .Get "caption" }}<figcaption>{{ . }}</figcaption>{{ end }}</figure>
