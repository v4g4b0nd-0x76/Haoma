baseURL = "/"
title = "Haoma"
defaultContentLanguage = "en"
# no content is ever filed under categories/tags, so don't emit those pages
taxonomies = {}
enableRobotsTXT = true
[markup.goldmark.renderer]
  unsafe = true
[languages.en]
  languageName = "English"
  languageCode = "en"
  languageDirection = "ltr"
  weight = 1
  contentDir = "content/en"
  [[languages.en.menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 4
[languages.fa]
  languageName = "فارسی"
  languageCode = "fa"
  languageDirection = "rtl"
  title = "هوم"
  weight = 2
  contentDir = "content/fa"
  [[languages.fa.menus.main]]
    name = "دربارهٔ ما"
    pageRef = "/about"
    weight = 4
