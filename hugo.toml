baseURL = "/"
title = "Haoma"
defaultContentLanguage = "en"
# no content is ever filed under categories/tags, so don't emit those pages
taxonomies = {}
enableRobotsTXT = true
[outputs]
  home = ["HTML", "RSS", "SearchIndex", "RelatedIndex", "Webmanifest"]
[outputFormats.SearchIndex]
  mediaType = "application/json"
  baseName = "search"
  isPlainText = true
  notAlternative = true
[outputFormats.RelatedIndex]
  mediaType = "application/json"
  baseName = "related"
  isPlainText = true
  notAlternative = true
[mediaTypes."application/manifest+json"]
  suffixes = ["webmanifest"]
[outputFormats.Webmanifest]
  mediaType = "application/manifest+json"
  baseName = "manifest"
  isPlainText = true
  notAlternative = true
[markup.goldmark.renderer]
  unsafe = true
[languages.en]
  languageName = "English"
  languageCode = "en"
  languageDirection = "ltr"
  weight = 1
  contentDir = "content/en"
  [[languages.en.menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 4
[languages.fa]
  languageName = "فارسی"
  languageCode = "fa"
  languageDirection = "rtl"
  title = "هوم"
  weight = 2
  contentDir = "content/fa"
  [[languages.fa.menus.main]]
    name = "دربارهٔ ما"
    pageRef = "/about"
    weight = 4
# Absolute origin for canonical / hreflang / og / robots when baseURL has no host.
# CI overrides baseURL to the Pages URL; this remains the SEO fallback.
[params]
  publicURL = "https://v4g4b0nd-0x76.github.io/Haoma"
