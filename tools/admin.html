<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="token" content="__TOKEN__"><title>Site editor</title>
<style>
:root{--bg:#0f1115;--s:#171a20;--s2:#1e222a;--b:#2b303a;--t:#d6d9e0;--m:#8a909c;--a:#7fa8c9;--ok:#6fbf8b;--bad:#e06c6c;--warn:#e0b45a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;height:100vh;overflow:hidden}
button,select,input,textarea{font:inherit;color:var(--t);background:var(--bg);border:1px solid var(--b);border-radius:8px;padding:6px 11px}
button{cursor:pointer;background:var(--s2)}button:hover{border-color:var(--a)}button.pri{background:var(--a);color:#0b0d10;border-color:var(--a);font-weight:600}button.link{background:none;border:0;color:var(--a);padding:0}
input:focus,textarea:focus,select:focus{outline:2px solid var(--a);outline-offset:-1px}
#app{display:grid;grid-template-columns:210px 290px 1fr;height:100vh}#app.nolist{grid-template-columns:210px 1fr}#app.nolist #panel{display:none}
#app.pv{grid-template-columns:210px 290px 1fr 1fr}#app.pv.nolist{grid-template-columns:210px 1fr 1fr}
#rail{background:var(--s);border-right:1px solid var(--b);display:flex;flex-direction:column;padding:12px 8px}
.logo{font-weight:700;font-size:15px;padding:6px 10px 14px}#rl{flex:1}
.rb{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:9px 10px;margin:1px 0;color:var(--m)}
.rb span{width:22px;text-align:center}.rb:hover{background:var(--s2);color:var(--t)}.rb.on{background:var(--s2);color:var(--a);box-shadow:inset 3px 0 var(--a)}
.rbot{border-top:1px solid var(--b);padding-top:10px;display:grid;gap:6px}.rbot button{width:100%}#branch{color:var(--m);font-size:12px;padding:0 4px}
#panel{background:var(--s);border-right:1px solid var(--b);overflow:auto;padding:12px}#main{overflow:auto;padding:22px 26px;min-width:0}
#pvwrap{display:none;border-left:1px solid var(--b);flex-direction:column;min-width:0}#app.pv #pvwrap{display:flex}#pvwrap iframe{flex:1;border:0;background:#fff}#pvwrap .row{padding:8px;background:var(--s)}
label{display:block;margin:10px 0 3px;color:var(--m);font-size:12px}input[type=text],select,textarea{width:100%}
.row{display:flex;gap:8px;align-items:center}.row>input,.row>select{flex:1}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.item{display:block;width:100%;text-align:left;border:0;background:none;padding:4px 8px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item:hover{background:var(--s2)}.item.on{color:var(--a);background:var(--s2)}
summary{cursor:pointer;color:var(--m);padding:3px 4px;font-size:12px;text-transform:uppercase;letter-spacing:.05em}summary.s2{text-transform:none;font-size:13px;color:var(--t);letter-spacing:0;padding-left:10px}details details{margin-left:6px}
.grp{color:var(--m);font-size:12px;margin:14px 0 4px;text-transform:uppercase;letter-spacing:.05em}.msg{color:var(--m);margin-left:8px}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
pre{background:var(--s);border:1px solid var(--b);padding:12px;border-radius:8px;overflow:auto;max-height:50vh;white-space:pre-wrap;font-size:12.5px}
.card{background:var(--s);border:1px solid var(--b);border-radius:12px;margin:12px 0;overflow:hidden}.card.pad{padding:14px 16px}.card .bn{height:90px;background:#000 center/cover}.card div.t{padding:10px 14px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}.crumb{color:var(--m);font-size:13px}h2{margin:.1em 0 .6em;font-size:22px}h3{margin:.2em 0 .6em}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.stat{background:var(--s);border:1px solid var(--b);border-radius:12px;padding:14px;text-align:left;cursor:pointer}.stat b{display:block;font-size:28px}.stat span{color:var(--m)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.chip{border-radius:99px;padding:3px 13px;font-size:13px}.chip.on{background:var(--a);color:#0b0d10;border-color:var(--a)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--b)}tr.go{cursor:pointer}tr.go:hover{background:var(--s)}th{color:var(--m);font-weight:500;font-size:12px}
.tag{display:inline-block;border:1px solid var(--b);border-radius:99px;padding:0 8px;font-size:11px;margin-right:4px;color:var(--warn)}
.sw{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}.sw input[type=color]{width:100%;height:32px;padding:2px}
textarea.ed{height:calc(100vh - 340px);min-height:240px}textarea.mono,textarea.ed{font:13px/1.6 ui-monospace,Menlo,Consolas,monospace;resize:vertical;tab-size:2}.tb{display:flex;gap:6px;margin:10px 0 6px;flex-wrap:wrap}
.pend{background:var(--s2);border:1px solid var(--warn);border-radius:8px;padding:8px}.pend b{color:var(--warn);display:block;margin-bottom:6px}.pend .row button{flex:1;padding:4px}
</style></head><body>
<div id="app"><nav id="rail"><div class="logo">📜 Site editor</div><div id="rl"></div><div class="rbot"><div id="pend" class="pend" hidden><b></b><div class="row"><button class="pri" id="sa">Save all</button><button id="da">Discard</button></div></div><div id="branch"></div><button id="bundo">↶ Undo last change</button><button id="bpv">▶ Preview</button><button id="bchk">Check build</button><div id="hmsg" class="msg"></div></div></nav>
<div id="panel"></div><div id="main"></div>
<div id="pvwrap"><div class="row"><input type="text" id="purl" readonly><button id="pre">⟳</button></div><iframe id="pf"></iframe></div></div>
<script>const T=document.querySelector('meta[name=token]').content;
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(p,o={}){const r=await fetch('/api/'+p,{...o,headers:{'X-Token':T}});const ct=r.headers.get('content-type')||'';const d=ct.includes('json')?await r.json():await r.text();if(!r.ok)throw new Error(d.error||d);return d}
const E=encodeURIComponent,get=p=>api('file?path='+E(p));
const q=s=>JSON.stringify(s),slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''),today=()=>new Date().toISOString().slice(0,10),nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const say=(t,c='')=>{$('#hmsg').className='msg '+c;$('#hmsg').textContent=t};
/* ===== state: nothing touches project files until Save ===== */
let files=[],orig={},drafts=new Map(),git={},audit=[],cur=null,view='dash',rf='all',cT=null,cN='en',timers={};
const DATA=['data/themes.json','data/nav.json','data/site.json'];
const J=p=>drafts.has(p)?drafts.get(p):orig[p];
const themes=()=>JSON.parse(J('data/themes.json')),nav=()=>JSON.parse(J('data/nav.json')),site=()=>{try{return JSON.parse(J('data/site.json'))}catch(e){return{repo:'',branch:'master'}}};
const setJ=(p,o)=>setDraft(p,JSON.stringify(o,null,2));
const allFiles=()=>{const s=new Set(files);drafts.forEach((v,p)=>v===null?s.delete(p):s.add(p));return[...s].sort()};
function setDraft(p,v){const o=orig[p];if(typeof v==='string'&&o!==undefined&&v===o){drafts.delete(p);clearTimeout(timers[p]);api('discard?path='+E(p),{method:'POST'}).catch(()=>{})}else{drafts.set(p,v);clearTimeout(timers[p]);timers[p]=setTimeout(()=>push(p),450)}pend()}
async function push(p){clearTimeout(timers[p]);const v=drafts.get(p);if(v===undefined)return;try{if(v===null)await api('draft?path='+E(p),{method:'DELETE'});else await api('draft?path='+E(p),{method:'PUT',body:(v&&v.file)||v})}catch(e){say(e.message,'bad')}}
function pend(){const n=drafts.size;$('#pend').hidden=!n;$('#pend b').textContent=n+' unsaved'}
async function commit(paths,label){const x=nid(),sf=`&x=${x}&l=${E(label)}`;for(const p of paths){const v=drafts.get(p);if(v===undefined)continue;
  if(v===null){if(files.includes(p))await api('file?path='+E(p)+sf,{method:'DELETE'})}
  else if(v.file)await api('upload?path='+E(p)+sf,{method:'POST',body:v.file});else await api('file?path='+E(p)+sf,{method:'PUT',body:v});
  drafts.delete(p);delete orig[p]}await load();pend();refresh();say('Saved ✓','ok')}
async function discardPaths(paths){for(const p of paths){drafts.delete(p);clearTimeout(timers[p]);await api('discard?path='+E(p),{method:'POST'}).catch(()=>{})}await load();pend();refresh()}
async function load(){files=await api('tree');for(const p of DATA){try{orig[p]=await get(p)}catch(e){}}git=await api('git');$('#branch').textContent=git.ok?'⎇ '+git.branch:'not a git repo';audit=(await api('audit')).items;pend()}
function refresh(){const c=cur;render();if(c&&VIEWS[view][3]&&allFiles().includes(c)&&view!=='themes'&&view!=='nav')openFile(c)}
const VIEWS={dash:['🏠','Dashboard',pDash,0],content:['📝','Content',pContent,1],themes:['🎨','Themes',pThemes,1],nav:['🧭','Navigation',pNav,1],review:['🔎','Review',pReview,0],files:['🗂','Files',pFiles,1],history:['↶','History',pHistory,0],publish:['🚀','Publish & PR',pPublish,0],settings:['⚙️','Settings',pSettings,0]};
function render(){$('#rl').innerHTML='';for(const k in VIEWS){const b=document.createElement('button');b.className='rb'+(k===view?' on':'');b.innerHTML=`<span>${VIEWS[k][0]}</span>${VIEWS[k][1]}`;b.onclick=()=>{view=k;render()};$('#rl').append(b)}
 $('#app').classList.toggle('nolist',!VIEWS[view][3]);$('#panel').innerHTML='';$('#main').innerHTML='';VIEWS[view][2]()}
function list(paths,filter=''){return paths.filter(p=>p.includes(filter)).map(p=>`<button class="item ${p===cur?'on':''}" data-p="${esc(p)}" title="${esc(p)}">${drafts.has(p)?'● ':''}${esc(p.replace(/^content\//,''))}</button>`).join('')}
function bindItems(){document.querySelectorAll('#panel .item').forEach(b=>b.onclick=()=>openFile(b.dataset.p))}
function ctree(paths,filter){const f=filter.toLowerCase(),g={};paths.filter(p=>p.toLowerCase().includes(f)).forEach(p=>{const m=p.match(/^content\/(\w+)\/(.*)$/),l=m?m[1]:'other',rest=m?m[2]:p,pt=rest.split('/'),k=pt[0]==='cultures'&&pt.length>2?'cultures / '+pt[1]:pt[0].replace(/\.md$/,'');g[l]=g[l]||{};(g[l][k]=g[l][k]||[]).push(p)});
 return Object.keys(g).sort().map(l=>`<details open><summary>${l}</summary>${Object.keys(g[l]).sort().map(k=>`<details ${f?'open':''}><summary class="s2">${esc(k)}</summary>${g[l][k].map(p=>`<button class="item ${p===cur?'on':''}" data-p="${esc(p)}" title="${esc(p)}">${drafts.has(p)?'● ':''}${esc(p.split('/').slice(-2).join('/').replace(/\.md$/,''))}</button>`).join('')}</details>`).join('')}</details>`).join('')}
function pContent(){const md=allFiles().filter(f=>f.startsWith('content/'));$('#panel').innerHTML=`<div class="row"><button class="pri" id="np">+ Page</button><button id="nc">+ Culture</button></div><input type="text" id="cs" placeholder="Search content…" style="margin-top:10px"><div id="ct" style="margin-top:8px">${ctree(md,'')}</div>`;bindItems();$('#np').onclick=wizPage;$('#nc').onclick=wizCulture;$('#cs').oninput=()=>{$('#ct').innerHTML=ctree(md,$('#cs').value);bindItems()}}
/* ===== dashboard / review ===== */
const issues={drafts:a=>a.draft&&!a.index,stale:a=>a.stale,nosrc:a=>!a.sources&&!a.index,untr:a=>a.missing.length&&!a.index};
function pDash(){const pg=audit.filter(a=>!a.index),n=k=>audit.filter(issues[k]).length,ch=(git.status||'').split('\n').filter(Boolean);
 $('#main').innerHTML=`<h2>Dashboard</h2><p class="msg" style="margin:0">Counts describe saved files. Unsaved edits live only in the editor and the preview.</p><div class="stats" style="margin-top:12px">${[['all','Pages',pg.length],['drafts','Drafts',n('drafts')],['stale','Need review',n('stale')],['nosrc','Without sources',n('nosrc')],['untr','Untranslated',n('untr')]].map(([k,l,v])=>`<button class="stat" data-r="${k}"><b>${v}</b><span>${l}</span></button>`).join('')}<button class="stat" data-v="publish"><b>${ch.length}</b><span>Uncommitted files</span></button></div>
 <h3 style="margin-top:22px">Quick actions</h3><div class="row" style="flex-wrap:wrap"><button class="pri" id="qp">+ New page</button><button id="qc">+ New culture</button><button id="qv">▶ Preview site</button><button id="qk">Check build</button>${site().repo?`<button id="qi">GitHub issues ↗</button><button id="qr">Pull requests ↗</button>`:''}</div>
 <h3 style="margin-top:22px">Uncommitted changes</h3><pre>${esc(ch.join('\n')||'Working tree clean')}</pre>`;
 document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{rf=b.dataset.r;view='review';render()});document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});
 $('#qp').onclick=()=>{view='content';render();wizPage()};$('#qc').onclick=()=>{view='content';render();wizCulture()};$('#qv').onclick=()=>$('#bpv').click();$('#qk').onclick=()=>$('#bchk').click();
 if(site().repo){$('#qi').onclick=()=>window.open(site().repo+'/issues');$('#qr').onclick=()=>window.open(site().repo+'/pulls')}}
function pReview(){const L={all:'All',drafts:'Drafts',stale:'Need review (older than 180 days)',nosrc:'No sources',untr:'Missing translation'};
 const rows=audit.filter(a=>!a.index&&(rf==='all'||issues[rf](a)));
 $('#main').innerHTML=`<h2>Review</h2><p class="msg" style="margin:0">Find pages that need a source, a translation or a fresh review.</p><div class="chips">${Object.keys(L).map(k=>`<button class="chip ${k===rf?'on':''}" data-r="${k}">${L[k]}</button>`).join('')}</div>
 <table><tr><th>Page</th><th>Lang</th><th>Grade</th><th>Reviewed</th><th>Flags</th></tr>${rows.map(a=>`<tr class="go" data-p="${esc(a.path)}"><td>${esc(a.title)}<br><span class="msg" style="margin:0">${esc(a.path.replace('content/',''))}</span></td><td>${a.lang}</td><td>${esc(a.grade)}</td><td>${esc(a.reviewed||'-')}</td><td>${a.draft?'<span class="tag">draft</span>':''}${a.stale?'<span class="tag">review</span>':''}${a.sources?'':'<span class="tag">no sources</span>'}${a.missing.map(m=>`<span class="tag">no ${m}</span>`).join('')}</td></tr>`).join('')||'<tr><td colspan=5 class="ok">Nothing to fix here.</td></tr>'}</table>`;
 document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{rf=b.dataset.r;pReview()});document.querySelectorAll('tr.go').forEach(r=>r.onclick=()=>openFile(r.dataset.p))}
/* ===== new page / culture wizards (create DRAFTS, not files) ===== */
const cultures=()=>Object.keys(themes()).filter(k=>k!=='base'),SECS=['characters','stories','history'],SECFA={characters:'شخصیت‌ها',stories:'داستان‌ها',history:'تاریخ'};
const cap=s=>s[0].toUpperCase()+s.slice(1);
const cultIdx=(cu,title,tag)=>`---\ntitle: ${q(title)}\nculture: ${cu}\nquote: ""\nquoteSource: ""\ntagline: ${q(tag||'')}\ncascade:\n  culture: ${cu}\n---\n\nAbout ${title}.\n`;
const secIdx=(l,s)=>`---\ntitle: ${q(l==='fa'&&SECFA[s]?SECFA[s]:cap(s))}\ncascade:\n  sec: ${s}\n---\n`;
const fm=o=>'---\n'+Object.entries(o).filter(([k,v])=>v!==''&&v!==undefined&&!(Array.isArray(v)&&!v.length)).map(([k,v])=>Array.isArray(v)?k+':\n'+v.map(x=>'  - '+q(x)).join('\n'):k+': '+(typeof v==='string'&&!/^\d{4}-\d\d-\d\d$/.test(v)?q(v):v)).join('\n')+'\n---\n';
const ensure=(p,t)=>{if(!allFiles().includes(p))setDraft(p,t)};
function wizPage(){$('#main').innerHTML=`<h2>New page</h2><p class="msg" style="margin:0">Created as an unsaved draft. Nothing is written to the project until you press Save.</p><div class="two"><div><label>Type</label><select id="ty"><option value="culture">Culture page (character, story, history…)</option><option value="episode">Podcast episode</option><option value="plain">Plain page</option></select>
<label>Language</label><select id="lg"><option value="en">English</option><option value="fa">فارسی</option></select><label>Culture</label><select id="cu">${cultures().map(c=>`<option>${c}</option>`).join('')}</select>
<label>Section</label><input type="text" id="se" list="sl" value="characters"><datalist id="sl">${SECS.map(s=>`<option>${s}</option>`).join('')}</datalist><label>Title</label><input type="text" id="ti"><label>URL name (a-z, 0-9, dashes)</label><input type="text" id="sg"></div>
<div><label>Tagline</label><input type="text" id="tg"><label>Evidence grade</label><select id="gr"><option>primary text</option><option>later compilation</option><option>archaeology</option><option>modern scholarship</option><option>draft</option></select>
<label>Sources (one per line)</label><textarea id="so" rows="4"></textarea><label><input type="checkbox" id="st" checked> also create a stub in the other language</label></div></div><p><button class="pri" id="go">Create draft</button><span id="wm" class="msg"></span></p>`;
 $('#ti').oninput=()=>{if(!$('#sg').dataset.m)$('#sg').value=slug($('#ti').value)};$('#sg').oninput=()=>$('#sg').dataset.m=1;$('#go').onclick=createPage}
function createPage(){try{const g=id=>$('#'+id).value.trim(),ty=g('ty'),lg=g('lg'),cu=g('cu'),sg=g('sg');if(!g('ti'))throw Error('a title is required');if(!/^[a-z0-9-]+$/.test(sg))throw Error('URL name: use a-z, 0-9 and dashes only');
 const base={tagline:g('tg'),grade:g('gr'),sources:g('so').split('\n').map(s=>s.trim()).filter(Boolean),reviewed:today()};
 const mk=(l,title)=>{let path,front;if(ty==='culture'){const se=slug(g('se'))||'characters';ensure(`content/${l}/cultures/${cu}/_index.md`,cultIdx(cu,cap(cu)));ensure(`content/${l}/cultures/${cu}/${se}/_index.md`,secIdx(l,se));path=`content/${l}/cultures/${cu}/${se}/${sg}.md`;front=fm({title,...base})}
  else if(ty==='episode'){path=`content/${l}/episodes/${sg}/index.md`;front=fm({title,date:today(),culture:cu,grade:g('gr'),sources:base.sources,reviewed:today()})}
  else{path=`content/${l}/${sg}/_index.md`;front=fm({title})}
  if(allFiles().includes(path))throw Error('already exists: '+path);setDraft(path,front+'\nWrite here.\n');return path};
 const first=mk(lg,g('ti'));if($('#st').checked)mk(lg==='en'?'fa':'en','TODO translate: '+g('ti'));view='content';render();openFile(first)}catch(e){$('#wm').textContent=e.message;$('#wm').className='msg bad'}}
function wizCulture(){$('#main').innerHTML=`<h2>New culture</h2><p class="msg" style="margin:0">Created as unsaved drafts (folders, theme and banner).</p><div class="two"><div><label>Key (a-z, e.g. egyptian)</label><input type="text" id="k"><label>English name</label><input type="text" id="n1"><label>Farsi name</label><input type="text" id="n2" dir="rtl"><label>Tagline (English)</label><input type="text" id="t1"><label>Tagline (Farsi)</label><input type="text" id="t2" dir="rtl"></div>
<div><div class="sw"><div><label>Accent</label><input type="color" id="ac" value="#c9a45a"></div><div><label>Background</label><input type="color" id="bg" value="#15171a"></div></div><label>Background animation</label><select id="an"><option>fall</option><option>drift</option><option>rise</option><option>none</option></select><label>Top strip pattern</label><select id="pa"><option>none</option><option>meander</option><option>rosette</option><option>zigzag</option><option>waves</option></select>
<label>Banner art</label><select id="bs"><option value="mountains">Mountains + moon</option><option value="waves">Waves</option><option value="">None</option></select></div></div><p><button class="pri" id="go">Create draft</button><span id="wm" class="msg"></span></p>`;
 $('#go').onclick=()=>{try{const g=id=>$('#'+id).value.trim(),k=slug(g('k'));if(!k)throw Error('enter a key using a-z');const all=themes();if(all[k])throw Error('a theme named '+k+' already exists');
  for(const [l,n,t] of [['en',g('n1')||cap(k),g('t1')],['fa',g('n2')||g('n1')||cap(k),g('t2')]]){setDraft(`content/${l}/cultures/${k}/_index.md`,cultIdx(k,n,t));for(const s of SECS)setDraft(`content/${l}/cultures/${k}/${s}/_index.md`,secIdx(l,s))}
  let banner='';if(g('bs')){banner=k+'-gen.svg';setDraft('static/img/'+banner,genBanner(g('bs'),g('bg'),g('ac')))}
  all[k]={accent:g('ac'),bg:g('bg'),surface:mix(g('bg'),'#ffffff',.04),border:mix(g('bg'),'#ffffff',.13),text:'#cfd2d9',muted:'#8d929d',anim:g('an'),pattern:g('pa'),glyphs:'',banner};setJ('data/themes.json',all);cT=k;view='themes';render()}catch(e){$('#wm').textContent=e.message;$('#wm').className='msg bad'}}}
/* ===== editor ===== */
const split=t=>{const m=t.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);return m?{fm:m[1],body:m[2]}:{fm:'',body:t}};
const getK=(f,k)=>{const m=f.match(new RegExp('^'+k+':\\s*(.*)$','m'));if(!m)return'';let v=m[1].trim();if(v[0]==='"')try{v=JSON.parse(v)}catch(e){}return v};

$('#bundo').onclick=()=>undo();$('#sa').onclick=()=>commit([...drafts.keys()],'Save '+drafts.size+' changes');
$('#da').onclick=()=>{if(confirm('Discard all unsaved changes?'))discardPaths([...drafts.keys()])};
window.onbeforeunload=e=>{if(drafts.size){e.preventDefault();e.returnValue=''}};
api('resync',{method:'POST'}).then(load).then(render).catch(e=>say(e.message,'bad'));
</script></body></html>
