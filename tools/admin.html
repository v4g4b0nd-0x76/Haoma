<style>
:root{--bg:#0f1115;--s:#171a20;--s2:#1e222a;--b:#2b303a;--t:#d6d9e0;--m:#8a909c;--a:#7fa8c9;--ok:#6fbf8b;--bad:#e06c6c;--warn:#e0b45a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;height:100vh;overflow:hidden}
button,select,input,textarea{font:inherit;color:var(--t);background:var(--bg);border:1px solid var(--b);border-radius:8px;padding:6px 11px}
button{cursor:pointer;background:var(--s2)}button:hover{border-color:var(--a)}button.pri{background:var(--a);color:#0b0d10;border-color:var(--a);font-weight:600}button.link{background:none;border:0;color:var(--a);padding:0}
input:focus,textarea:focus,select:focus{outline:2px solid var(--a);outline-offset:-1px}
#app{display:grid;grid-template-columns:200px 300px 1fr;height:100vh}#app.nolist{grid-template-columns:200px 1fr}#app.nolist #panel{display:none}
/* no backend: the file panel has nothing to list, so it is not shown at all */
#app.static{grid-template-columns:200px 1fr}#app.static #panel{display:none}
#app.pv{grid-template-columns:180px 260px 1fr 1fr}#app.pv.nolist{grid-template-columns:200px 1fr 1fr}
#app.note-mode #main{padding:0;display:flex;flex-direction:column;overflow:hidden}
#app.note-mode #panel{padding:10px 8px}
#rail{background:var(--s);border-right:1px solid var(--b);display:flex;flex-direction:column;padding:12px 8px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;padding:6px 10px 14px;color:#e0a03a}.logo svg{width:30px;height:30px}#rl{flex:1}
.rb{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:9px 10px;margin:1px 0;color:var(--m)}
.rb span{width:22px;text-align:center}.rb:hover{background:var(--s2);color:var(--t)}.rb.on{background:var(--s2);color:var(--a);box-shadow:inset 3px 0 var(--a)}
.rbot{border-top:1px solid var(--b);padding-top:10px;display:grid;gap:6px}.rbot button{width:100%}#branch{color:var(--m);font-size:12px;padding:0 4px}
#panel{background:var(--s);border-right:1px solid var(--b);overflow:auto;padding:12px;scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--a) 40%,var(--b)) var(--bg)}
#panel::-webkit-scrollbar{width:8px}#panel::-webkit-scrollbar-track{background:var(--bg)}
#panel::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--a) 35%,var(--b));border-radius:99px;border:2px solid var(--bg)}
#main{overflow:auto;padding:22px 26px;min-width:0}
.vault-tools{display:flex;gap:6px;margin-bottom:8px}.vault-tools button{flex:1;padding:7px 8px;font-size:12.5px}
.vault-search{width:100%;margin:0 0 10px;padding:9px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--b)}
.vault-search:focus{border-color:var(--a)}
#ct details{margin:0 0 2px}#ct>details>summary{font-size:11px;letter-spacing:.08em;padding:8px 8px 4px;color:var(--m)}
#ct summary.s2{padding:6px 10px;border-radius:8px;font-weight:600;color:var(--t)}
#ct summary.s2:hover,#ct summary.s3:hover{background:var(--s2)}
#ct summary.s3{padding:5px 10px 5px 16px;border-radius:8px;font-weight:550;font-size:12.5px;color:var(--m);text-transform:none;letter-spacing:0}
#ct details.sec{margin-inline-start:6px;border-inline-start:1px solid var(--b);padding-inline-start:4px}
#ct .item{padding:7px 12px 7px 18px;border-radius:8px;font-size:13px;margin:1px 0;line-height:1.35;white-space:normal}
#ct details.sec .item{padding-inline-start:22px}
#ct .item .path{display:block;font-size:11px;color:var(--m);margin-top:1px}
#ct .item.on{box-shadow:inset 3px 0 var(--a)}
#ct .item.hub{color:var(--a);font-weight:600}
#pvwrap{display:none;border-left:1px solid var(--b);flex-direction:column;min-width:0}#app.pv #pvwrap{display:flex}#pvwrap iframe{flex:1;border:0;background:#fff}#pvwrap .row{padding:8px;background:var(--s)}
label{display:block;margin:10px 0 3px;color:var(--m);font-size:12px}input[type=text],select,textarea{width:100%}
.row{display:flex;gap:8px;align-items:center}.row>input,.row>select{flex:1}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.item{display:block;width:100%;text-align:left;border:0;background:none;padding:4px 8px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item:hover{background:var(--s2)}.item.on{color:var(--a);background:var(--s2)}
summary{cursor:pointer;color:var(--m);padding:3px 4px;font-size:12px;text-transform:uppercase;letter-spacing:.05em}summary.s2{text-transform:none;font-size:13px;color:var(--t);letter-spacing:0;padding-left:10px}details details{margin-left:6px}
.grp{color:var(--m);font-size:12px;margin:14px 0 4px;text-transform:uppercase;letter-spacing:.05em}.msg{color:var(--m);margin-left:8px}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
button:disabled{opacity:.45;cursor:not-allowed}
pre{background:var(--s);border:1px solid var(--b);padding:12px;border-radius:8px;overflow:auto;max-height:50vh;white-space:pre-wrap;font-size:12.5px}
.card{background:var(--s);border:1px solid var(--b);border-radius:12px;margin:12px 0;overflow:hidden}.card.pad{padding:14px 16px}.card .bn{height:90px;background:#000 center/cover}.card div.t{padding:10px 14px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}.crumb{color:var(--m);font-size:13px}h2{margin:.1em 0 .6em;font-size:22px}h3{margin:.2em 0 .6em}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.stat{background:var(--s);border:1px solid var(--b);border-radius:12px;padding:14px;text-align:left;cursor:pointer}.stat b{display:block;font-size:28px}.stat span{color:var(--m)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.chip{border-radius:99px;padding:3px 13px;font-size:13px}.chip.on{background:var(--a);color:#0b0d10;border-color:var(--a)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--b)}tr.go{cursor:pointer}tr.go:hover{background:var(--s)}th{color:var(--m);font-weight:500;font-size:12px}
.tag{display:inline-block;border:1px solid var(--b);border-radius:99px;padding:0 8px;font-size:11px;margin-right:4px;color:var(--warn)}
.sw{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}.sw input[type=color]{width:100%;height:32px;padding:2px}
textarea.ed{height:calc(100vh - 340px);min-height:240px}textarea.mono,textarea.ed{font:13px/1.6 ui-monospace,Menlo,Consolas,monospace;resize:vertical;tab-size:2}.tb{display:flex;gap:6px;margin:10px 0 6px;flex-wrap:wrap}
.bdg{margin-left:auto;font-style:normal;color:var(--warn);font-size:12px}.pend{background:var(--s2);border:1px solid var(--warn);border-radius:8px;padding:8px}.pend b{color:var(--warn);display:block;margin-bottom:6px}.pend .row button{flex:1;padding:4px}
.sep{width:1px;background:var(--b);margin:0 4px}code{background:var(--s2);padding:1px 6px;border-radius:5px}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50}.mdl{background:var(--s);border:1px solid var(--b);border-radius:14px;width:min(760px,94vw);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--b)}.mh .x{border:0;background:none;font-size:16px}.mb{padding:14px 18px;overflow:auto}.mf{padding:12px 18px;border-top:1px solid var(--b);display:flex;gap:8px;align-items:center}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin:10px 0;max-height:210px;overflow:auto}.mi{position:relative;padding:4px;border-radius:10px;display:flex;flex-direction:column;gap:3px;text-align:center;font-size:11px}.mi img,.mi .vt{width:100%;height:64px;object-fit:cover;border-radius:7px;background:#000;display:flex;align-items:center;justify-content:center;font-size:24px}.mi span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mi.on{border-color:var(--a);background:var(--s2)}.mi i{position:absolute;top:6px;right:6px;background:var(--a);color:#0b0d10;font-style:normal;font-weight:700;border-radius:99px;min-width:20px;padding:0 5px;font-size:12px}
.gpick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.gp{padding:8px;text-align:center;font-size:12px;display:flex;flex-direction:column;gap:6px}.gp.on{border-color:var(--a);background:var(--s2)}.gm{display:grid;gap:3px;height:46px}.gm i{background:var(--b);border-radius:3px;min-height:12px}.gm i.i{background:var(--a);opacity:.65}.gm i.h{background:var(--m);opacity:.5;min-height:10px}
/* ===== myth map studio ===== */
.mdl.wide{width:min(1340px,96vw);max-height:94vh;--a:#e0a03a;--s2:#1c1b18}
.mdl.wide .mh b{font:600 17px Georgia,serif;letter-spacing:.01em;color:#ecc98a}
.ms-grid{display:grid;grid-template-columns:minmax(0,1fr) 326px;gap:18px;align-items:start}
.ms-stage{background:radial-gradient(130% 130% at 50% 0%,#181c24,#0d0f13);border:1px solid var(--b);border-radius:14px;padding:14px;display:flex;justify-content:center;min-height:260px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.ms-canvas{position:relative;border-radius:8px;outline:1px solid rgba(224,160,58,.45);box-shadow:0 16px 46px rgba(0,0,0,.6);background:#0a0c10;cursor:crosshair;touch-action:none}
.ms-canvas>img{display:block;width:100%;height:100%;border-radius:8px;background:#0a0c10}
.ms-canvas.noart>img{display:none}
.ms-canvas.noart{display:flex;align-items:center;justify-content:center;padding:18px;color:#93896a;font:italic 14px/1.7 Georgia,serif;text-align:center;letter-spacing:.03em}
.ms-ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.mpoly{pointer-events:none;cursor:pointer}
.regmode .mpoly{pointer-events:auto}
.regmode.drawing .mpoly{pointer-events:none}
.mpoly polygon{fill:var(--c);fill-opacity:.13;stroke:var(--c);stroke-width:1.6;stroke-dasharray:5 4;vector-effect:non-scaling-stroke}
.mpoly.on polygon{fill-opacity:.32;stroke-width:2.6;stroke-dasharray:none}
.mroute{fill:none;stroke:#f0d79a;stroke-width:1.6;stroke-dasharray:6 5;vector-effect:non-scaling-stroke;opacity:.85}
.mdraft{fill:#e0a03a;fill-opacity:.13;stroke:#e0a03a;stroke-width:1.6;stroke-dasharray:3 3;vector-effect:non-scaling-stroke}
.mdraftband{fill:none;stroke:#e0a03a;stroke-width:1.4;stroke-dasharray:3 3;vector-effect:non-scaling-stroke;opacity:.8}
.ms-pins{position:absolute;inset:0;pointer-events:none}
.mpin{position:absolute;transform:translate(-50%,-50%);background:none;border:0;padding:7px;cursor:grab;line-height:0;color:inherit;pointer-events:auto}
.regmode .mpin{pointer-events:none}
.mpin .d{display:block;width:11px;height:14px;background:var(--c);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;box-shadow:0 0 0 2px #0a0c10,0 0 12px var(--c)}
.mpin .n{position:absolute;top:-5px;left:50%;transform:translateX(-50%);font:700 9px/12px system-ui;color:#0a0c10;background:var(--c);border-radius:99px;min-width:12px;padding:0 2px;pointer-events:none}
.mpin .l{position:absolute;top:100%;left:50%;transform:translateX(-50%);font:600 11px/1.3 Georgia,serif;color:#f2ead8;white-space:nowrap;text-shadow:0 1px 4px #000,0 0 10px rgba(0,0,0,.9);pointer-events:none}
.mpin.on .d{box-shadow:0 0 0 2px #e0a03a,0 0 20px var(--c)}
.mpin.on .l{text-decoration:underline;text-underline-offset:3px}
.ms-verts{position:absolute;inset:0;pointer-events:none}
.mvert{position:absolute;width:12px;height:12px;transform:translate(-50%,-50%);background:#e0a03a;border:2px solid #0a0c10;border-radius:3px;cursor:grab;pointer-events:auto;padding:0;box-shadow:0 0 8px rgba(0,0,0,.7)}
.mvert:hover{transform:translate(-50%,-50%) scale(1.35)}
.ms-bar{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
.ms-modes{display:flex;gap:4px;background:var(--s2);border:1px solid var(--b);border-radius:10px;padding:3px}
.ms-modes button{border:0;background:none;padding:6px 14px;border-radius:8px;font-size:13px;color:var(--m)}
.ms-modes button.on{background:var(--a);color:#14161a;font-weight:600}
.ms-hint{color:var(--m);font-size:12.5px}
.ms-arts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:264px;overflow:auto;padding:2px}
.ms-arts button{padding:5px;border-radius:10px;background:none;border:1px solid transparent;cursor:pointer;text-align:left}
.ms-arts .ph{display:flex;height:46px;align-items:center;justify-content:center;background:#12141a;border-radius:6px;font-size:18px;color:var(--m);overflow:hidden}
.ms-arts img{display:block;width:100%;height:46px;object-fit:cover;border-radius:6px;background:#000}
.ms-arts b{display:block;font-weight:500;font-size:10.5px;color:var(--m);line-height:1.3;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms-arts button.on{border-color:var(--a);background:var(--s2)}
.ms-arts button.on b{color:var(--a)}
.msw{display:flex;gap:6px}
.msw button{width:24px;height:24px;border-radius:50%;border:2px solid transparent;background:var(--c);cursor:pointer;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.msw button.on{border-color:#fff;box-shadow:0 0 0 2px var(--c)}
.ms-items{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
.ms-sec>summary{cursor:pointer;color:var(--m);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding:2px 0}
.ms-set h4{margin:16px 0 6px;font:700 11.5px system-ui;letter-spacing:.06em;text-transform:uppercase;color:var(--m)}
.ms-set h4:first-child{margin-top:0}
.ms-set .lab{margin:12px 0 3px;display:block}
.mrow{display:flex;gap:8px;align-items:center;padding:5px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.mrow:hover{background:var(--s2)}
.mrow.on{background:var(--s2);border-color:var(--a)}
.mrow>i{width:11px;height:11px;border-radius:50%;background:var(--c);flex:0 0 auto;box-shadow:0 0 8px var(--c)}
.mrow>b{flex:1;font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow>em{font-style:normal;color:var(--m);font-size:11.5px;font-family:ui-monospace,Menlo,monospace}
.mrow .x{border:0;background:none;color:var(--m);padding:0 2px;line-height:1}
.mrow .x:hover{color:#e05040}
.mform{border-top:1px dashed var(--b);margin-top:8px;padding-top:8px}
.mform label{margin:8px 0 2px}
.mp-read{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--warn)}
.mp-posbtn{padding:4px 7px;font-size:11px;line-height:1}
#mp_draw button[disabled]{opacity:.4;cursor:default}
/* Obsidian-style context menu */
#ctx{position:fixed;z-index:80;min-width:200px;background:var(--s);border:1px solid var(--b);border-radius:10px;padding:4px;box-shadow:0 12px 36px rgba(0,0,0,.55);display:none}
#ctx button{display:block;width:100%;text-align:left;border:0;background:none;border-radius:7px;padding:7px 12px;color:var(--t);font-size:13px}
#ctx button:hover{background:var(--s2);color:var(--a)}#ctx button.bad:hover{color:var(--bad)}
#ctx .sep{height:1px;background:var(--b);margin:4px 6px}
.guide{background:linear-gradient(135deg,color-mix(in srgb,var(--a) 12%,var(--s)),var(--s));border:1px solid var(--b);border-radius:12px;padding:16px 18px;margin:0 0 16px}
.guide ol{margin:8px 0 0;padding-inline-start:1.3rem;color:var(--m)}.guide li{margin:4px 0}
.relbox{display:flex;flex-wrap:wrap;gap:8px;max-height:200px;overflow:auto;padding:2px 0 4px}
.relchip{appearance:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--b);border-radius:99px;padding:4px 12px 4px 8px;background:transparent;color:var(--m);font-size:12.5px;cursor:pointer;line-height:1.3}
.relchip .tick{width:1.1em;text-align:center;font-weight:700}
.relchip:hover{border-color:var(--a);color:var(--t)}
.relchip.on{border-color:var(--ok);color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.relchip.reladd{border-style:dashed;color:var(--a)}
.atlasbox{display:flex;flex-direction:column;gap:6px;margin:4px 0 2px;max-height:280px;overflow:auto;padding:2px 0}
.atlasstep{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:8px 10px;border:1px solid var(--b);border-radius:10px;background:var(--s2)}
.atlasstep__n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 12px/1 system-ui,sans-serif;color:var(--a);border:1px solid color-mix(in srgb,var(--a) 45%,var(--b));background:color-mix(in srgb,var(--a) 12%,transparent)}
.atlasstep__meta{min-width:0}.atlasstep__meta b{display:block;font-size:13px;font-weight:600;color:var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.atlasstep__meta span{display:block;font-size:11.5px;color:var(--m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.atlasstep__acts{display:flex;gap:4px;flex-shrink:0}
.atlasstep__acts button{padding:4px 8px;font-size:12px;min-width:32px}
.atlasbox .reladd{align-self:flex-start;margin-top:2px}
.relgrp{width:100%;margin:6px 0 2px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--m)}
.pairbox{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 4px}
.pairslot{appearance:none;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px 14px;border:1px dashed var(--b);border-radius:12px;background:var(--bg);color:var(--m);cursor:pointer;text-align:left;min-height:72px}
.pairslot:hover{border-color:var(--a);color:var(--t)}
.pairslot.has{border-style:solid;border-color:color-mix(in srgb,var(--a) 55%,var(--b));color:var(--t)}
.pairslot b{font-size:14px;color:var(--t)}.pairslot span{font-size:12px;color:var(--m);word-break:break-all}
.azhint{margin:8px 0 0;padding:8px 12px;border-radius:10px;border:1px solid var(--b);background:var(--bg);color:var(--m);font-size:13px}
.azhint b{color:var(--a);font-size:1.1em}
.listenbox{margin:12px 0 4px;padding:12px 14px;border-radius:12px;border:1px solid color-mix(in srgb,var(--a) 40%,var(--b));background:color-mix(in srgb,var(--a) 8%,var(--s))}
.listenbox__h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 8px}
.listenbox__h b{font-size:13px;color:var(--a);letter-spacing:.04em;text-transform:uppercase}
.listenbox__meta{margin:0 0 8px;font-size:13px;color:var(--t)}
.listenbox__meta code{font-size:12px}
.listenbox__row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.listenbox audio{width:100%;max-width:420px;height:36px;margin-top:8px}
.ppick-tools{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px;align-items:center}
.ppick-tools input{flex:1;min-width:160px}
.ppick-filters{display:flex;gap:6px;flex-wrap:wrap}
.ppick-filters button{border-radius:99px;padding:3px 12px;font-size:12.5px}
.ppick-filters button.on{background:var(--a);color:#0b0d10;border-color:var(--a)}
.ppick-list{list-style:none;margin:0;padding:0;max-height:48vh;overflow:auto;border:1px solid var(--b);border-radius:10px}
.ppick-list li{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border-bottom:1px solid color-mix(in srgb,var(--b) 80%,transparent);cursor:pointer}
.ppick-list li:last-child{border-bottom:0}
.ppick-list li:hover,.ppick-list li.on{background:var(--s2)}
.ppick-list li b{font-weight:600}.ppick-list li span{color:var(--m);font-size:12px;text-align:end}
.chklist{display:flex;flex-wrap:wrap;gap:8px;margin:0;font-size:12px;color:var(--m)}
.chklist span{border:1px solid var(--b);border-radius:99px;padding:2px 10px}
.chklist span.ok{border-color:var(--ok);color:var(--ok)}
.chklist span.bad{border-color:var(--bad);color:var(--bad)}
/* Obsidian-like note workspace */
.note{display:flex;flex-direction:column;height:100%;min-height:0;background:var(--bg)}
.note__top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 22px;border-bottom:1px solid var(--b);background:var(--s);flex-shrink:0}
.note__crumb{color:var(--m);font-size:12.5px}.note__actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.note__scroll{flex:1;min-height:0;overflow:auto;padding:18px 28px 28px;display:flex;flex-direction:column;gap:14px}
.note__title{width:100%;border:0;background:transparent;font:700 1.65rem/1.25 system-ui,-apple-system,"Segoe UI",sans-serif;padding:4px 0;color:var(--t);border-radius:0}
.note__title:focus{outline:none;box-shadow:inset 0 -2px 0 var(--a)}
.note__hint{margin:0;color:var(--m);font-size:13px}
.note__props{border:1px solid var(--b);border-radius:12px;background:var(--s);overflow:hidden;flex-shrink:0}
.note__props>summary{list-style:none;padding:12px 16px;font-size:13px;font-weight:600;color:var(--t);text-transform:none;letter-spacing:0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.note__props>summary::-webkit-details-marker{display:none}
.note__props>summary::after{content:"▸";color:var(--m);font-size:12px}
.note__props[open]>summary::after{content:"▾"}
.note__props .inner{padding:0 16px 16px;border-top:1px solid var(--b)}
.note__bodywrap{flex:1;min-height:280px;display:flex;flex-direction:column;border:1px solid var(--b);border-radius:14px;background:var(--s);overflow:hidden}
.note__tb{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 10px;border-bottom:1px solid var(--b);background:var(--s2)}
.note__tb button{font-size:12.5px;padding:5px 10px}
.note__tb .sep{align-self:stretch}
textarea.ed.note__body{flex:1;min-height:320px;height:auto;border:0;border-radius:0;padding:22px 24px;font:15px/1.7 ui-monospace,Menlo,Consolas,monospace;background:transparent;resize:none;tab-size:2}
textarea.ed.note__body::placeholder{color:var(--m);opacity:.75}
.note__foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:0 2px}
#pal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);display:none;align-items:flex-start;justify-content:center;padding:12vh 16px 16px}
#pal.on{display:flex}#pal .box{width:min(520px,100%);background:var(--s);border:1px solid var(--b);border-radius:14px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.55)}
#pal input{width:100%;border:0;border-bottom:1px solid var(--b);border-radius:0;padding:14px 16px;font-size:16px;background:var(--s2)}
#pal ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}
#pal li{padding:9px 12px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
#pal li.on,#pal li:hover{background:var(--s2)}#pal li b{font-weight:600}#pal li span{color:var(--m);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.ap-sw{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid var(--b);vertical-align:middle;margin-inline-end:6px}
.ap-refs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.ap-refs .ri{position:relative;width:72px;height:72px;border-radius:8px;overflow:hidden;border:1px solid var(--b);background:#000}
.ap-refs .ri img{width:100%;height:100%;object-fit:cover;display:block}
.ap-refs .ri button{position:absolute;top:2px;right:2px;padding:0 5px;font-size:11px;line-height:1.4;border-radius:4px}
pre.ap-out{white-space:pre-wrap;max-height:42vh;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;user-select:text}
.ap-tip{background:color-mix(in srgb,var(--a) 10%,var(--s));border:1px solid var(--b);border-radius:10px;padding:10px 12px;margin:0 0 14px;color:var(--m);font-size:13px}
.pg-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.pg-tabs button{appearance:none;border:1px solid var(--b);background:var(--s);color:var(--t);border-radius:999px;padding:7px 14px;font:600 13px/1 var(--font,system-ui);cursor:pointer}
.pg-tabs button.on{border-color:var(--a);background:color-mix(in srgb,var(--a) 16%,var(--s));color:var(--a)}
.pg-pane[hidden]{display:none!important}

/* Farsi UI: rail on the right, soft RTL for chrome; code/paths stay LTR */
html[dir=rtl] #app{direction:rtl}
html[dir=rtl] #rail{border-right:0;border-left:1px solid var(--b)}
html[dir=rtl] #panel{border-right:0;border-left:1px solid var(--b)}
html[dir=rtl] #pvwrap{border-left:0;border-right:1px solid var(--b)}
html[dir=rtl] .rb{text-align:right}
html[dir=rtl] .rb.on{box-shadow:inset -3px 0 var(--a)}
html[dir=rtl] #ct .item.on{box-shadow:inset -3px 0 var(--a)}
html[dir=rtl] th,td{text-align:right}
html[dir=rtl] .pairslot,.atlasstep,.note__crumb{text-align:right}
html[dir=rtl] .logo{flex-direction:row-reverse}
html[dir=rtl] .guide ol{padding-inline-start:1.3rem}
html[dir=rtl] code,pre,textarea.ed,textarea.mono,.crumb,#purl,.vault-search,#cs,#ff{direction:ltr;text-align:left;unicode-bidi:isolate}
#blang{width:100%;font-size:12.5px}
html[dir=rtl] body{font-family:Tahoma,"Segoe UI",system-ui,sans-serif}

function mattrs(s){const o={};let x,re=/([a-z]+)="([^"]*)"/g;while((x=re.exec(s)))o[x[1]]=x[2];return o}
function parseMap(txt){
 const h=/\{\{<\s*map\b([\s\S]*?)>\}\}/.exec(txt),A=mattrs(h?h[1]:''),st=h?h[0].length:0;
 const cl=txt.indexOf('{{<',st),body=txt.slice(st,cl<0?txt.length:cl),pins=[],regions=[];
 body.split('\n').forEach(l=>{const t=l.trim();
  if(/^pin\b/.test(t)){const a=mattrs(t);pins.push({x:parseFloat(a.x)||50,y:parseFloat(a.y)||50,label:a.label||'',note:a.note||'',href:a.href||'',color:a.color||'gold',era:a.era||'',mid:a.id||''})}
  else if(/^region\b/.test(t)){const a=mattrs(t);regions.push({pts:(a.points||'').split(/\s+/).map(s=>s.split(',').map(Number)).filter(p=>p.length===2&&isFinite(p[0])&&isFinite(p[1])),label:a.label||'',note:a.note||'',href:a.href||'',color:a.color||'gold',era:a.era||'',mid:a.id||''})}});
 return{id:A.id||'',src:A.src||'',width:A.width||'100%',height:A.height||'480px',theme:A.theme||'dark',route:A.route||'',pulse:A.pulse!=='false',caption:A.caption||'',eras:A.eras||'',pins,regions};
}
async function mapDims(src){
 if(!src)return{w:800,h:480};
 if(/\.svg$/i.test(src))try{const v=/viewBox="([\d.\s,+-]+)"/.exec(await get('static/'+src));
  if(v){const a=v[1].trim().split(/[\s,]+/).map(Number);if(a.length===4&&a[2]>0&&a[3]>0)return{w:a[2],h:a[3]}}}catch(e){}
 return await new Promise(r=>{const i=new Image();i.onload=()=>r({w:i.naturalWidth||1200,h:i.naturalHeight||650});i.onerror=()=>r({w:1200,h:650});i.src=`/api/raw?path=${E('static/'+src)}&ws=1&t=${T}`});
}
const MAPFA=r=>/-fa(?=\.[a-z]+$)/i.test(r),MAPSTRIP=r=>r.replace(/-fa(?=\.[a-z]+$)/i,'');
function bMap(env){
 const {ins,ta,wide}=env,NS='http://www.w3.org/2000/svg';
 const clamp=v=>Math.max(0,Math.min(100,Math.round((+v||0)*10)/10));
 /* every map shortcode already on this page */
 const blocks=[];{const re=/\{\{<\s*map\b[\s\S]*?\{\{<\s*\/map\s*>\}\}/g;let g;while((g=re.exec(ta.value)))blocks.push({s:g.index,e:g.index+g[0].length,t:g[0]})}
 const pos=ta.selectionStart;let idx=blocks.findIndex(b=>pos>=b.s&&pos<=b.e);
 const blank=()=>({id:'',src:'',width:'100%',height:'480px',theme:'dark',route:'',pulse:true,caption:'',eras:'',pins:[],regions:[]});
 let S=idx<0?blank():parseMap(blocks[idx].t);
 let mode='pin',sel=null,draft=null,lastAdd=0,AR=5/3,langFA=/^content\/fa\//.test(cur||'');
 /* ready-made artwork, grouped into EN / FA pairs */
 const byBase={};
 allFiles().filter(f=>/^static\/img\/maps\//.test(f)&&MEDIA_RE.test(f)).forEach(f=>{const r=relp(f),b=MAPSTRIP(r);(byBase[b]=byBase[b]||{})[MAPFA(r)?'fa':'en']=r});
 const bases=Object.keys(byBase).sort((a,b)=>{const na=a.slice(a.lastIndexOf('/')+1),nb=b.slice(b.lastIndexOf('/')+1);const ia=MAPORD.indexOf(na),ib=MAPORD.indexOf(nb);return(ia<0?99:ia)-(ib<0?99:ib)||na.localeCompare(nb)});
 const baseOf=src=>MAPSTRIP(src||'');
 const pickSrc=b=>byBase[b]?(byBase[b][langFA?'fa':'en']||byBase[b][langFA?'en':'fa']||''):'';
 const pages=[...new Set(allFiles().filter(f=>/^content\/.+\.md$/.test(f)).map(pageUrl).filter(Boolean))];
 let m=null,el,cv,imgEl,ov,dynG,band,pw,vw;
 const q=s=>m.querySelector(s),stErr=t=>{const n=q('#mm');if(n){n.textContent=t;n.className='msg bad'}};
 const raw=f=>`/api/raw?path=${E('static/'+f)}&ws=1&t=${T}`;
 const curObj=()=>!sel?null:(sel.t==='pin'?S.pins[sel.i]:S.regions[sel.i]);
 const routePts=()=>!S.route?[]:(S.route==='auto'?S.pins.map(p=>[p.x,p.y])
   :S.route.split(/\s+/).map(s=>s.split(',').map(Number)).filter(a=>a.length===2&&isFinite(a[0])&&isFinite(a[1])));

  <label class="lab">Caption</label><input type="text" id="mp_cap" placeholder="What this map shows" value="${esc(S.caption)}">

  <label class="lab">Era order (optional)</label><input type="text" id="mp_eras" placeholder="lands,achaemenid,parthian,myth" value="${esc(S.eras||'')}">
  <datalist id="mp_pages">${pages.map(p=>`<option value="${esc(p)}">`).join('')}</datalist>
  <datalist id="mp_eras_list"><option value="lands"><option value="achaemenid"><option value="parthian"><option value="assyrian"><option value="myth"></datalist>`;

  ${blocks.length?`<div class="row" style="margin:0 0 12px;gap:8px"><label style="margin:0;white-space:nowrap">Map on this page</label><select id="mp_which" style="flex:1"><option value="-1">＋ New map</option>${blocks.map((b,i)=>{const a=parseMap(b.t);return `<option value="${i}"${i===idx?' selected':''}>${esc(a.id||'map #'+(i+1))} — ${a.pins.length} pin(s), ${a.regions.length} region(s)</option>`}).join('')}</select></div>`:''}

 /* ---------- canvas ---------- */
 function fit(){
  if(!cv||!el)return;
  const cs=getComputedStyle(el);
  const availW=el.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  if(availW<50)return;
  const maxH=Math.max(240,Math.min(window.innerHeight*0.48,520)-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom));
  let w=availW,h=w/AR;if(h>maxH){h=maxH;w=h*AR}
  cv.style.width=Math.round(w)+'px';cv.style.height=Math.round(h)+'px';
 }
 const refit=()=>mapDims(S.src).then(d=>{AR=d.w/d.h;fit()}).catch(()=>{});
 function buildStage(){
  el=q('#mp_stage');el.innerHTML='';
  cv=document.createElement('div');cv.className='ms-canvas';
  imgEl=document.createElement('img');imgEl.alt='';cv.append(imgEl);
  const ph=document.createElement('span');ph.className='noartph';ph.textContent='Procedural parchment map — choose artwork below, or upload your own';ph.style.display='none';cv.append(ph);
  ov=document.createElementNS(NS,'svg');ov.setAttribute('class','ms-ov');
  ov.setAttribute('viewBox','0 0 100 100');ov.setAttribute('preserveAspectRatio','none');
  dynG=document.createElementNS(NS,'g');ov.append(dynG);
  band=document.createElementNS(NS,'polyline');band.setAttribute('class','mdraftband');band.style.display='none';ov.append(band);
  cv.append(ov);
  pw=document.createElement('div');pw.className='ms-pins';cv.append(pw);
  vw=document.createElement('div');vw.className='ms-verts';cv.append(vw);
  el.append(cv);wire();
 }
 function syncGeom(){
  if(!cv)return;
  const ph=cv.querySelector('.noartph');
  if(S.src){imgEl.style.display='';if(ph)ph.style.display='none';cv.classList.remove('noart');
   if(imgEl.dataset.s!==S.src){imgEl.dataset.s=S.src;imgEl.src=raw(S.src)}}
  else{imgEl.style.display='none';imgEl.removeAttribute('src');delete imgEl.dataset.s;ph.style.display='';cv.classList.add('noart')}
  dynG.textContent='';
  const rp=routePts();
  if(rp.length>1){const pl=document.createElementNS(NS,'polyline');pl.setAttribute('class','mroute');pl.setAttribute('points',rp.map(p=>p.join(',')).join(' '));dynG.append(pl)}
  S.regions.forEach((R,i)=>{if(R.pts.length<3)return;
   const g=document.createElementNS(NS,'g');g.setAttribute('class','mpoly'+(sel&&sel.t==='reg'&&sel.i===i?' on':''));g.dataset.i=i;
   g.style.setProperty('--c',MAPCOL[R.color]||MAPCOL.gold);
   const pg=document.createElementNS(NS,'polygon');pg.setAttribute('points',R.pts.map(p=>p[0]+','+p[1]).join(' '));g.append(pg);dynG.append(g)});
  if(draft&&draft.length){const g=document.createElementNS(NS,'g');g.setAttribute('class','mdraft');
   const pg=document.createElementNS(NS,'polygon');pg.setAttribute('points',draft.map(p=>p[0]+','+p[1]).join(' '));g.append(pg);dynG.append(g);
   band.setAttribute('points',draft.map(p=>p[0]+','+p[1]).join(' '));band.style.display=''}
  else band.style.display='none';
  pw.textContent='';
  S.pins.forEach((P,i)=>{const b=document.createElement('button');b.type='button';
   b.className='mpin'+(sel&&sel.t==='pin'&&sel.i===i?' on':'');
   b.style.left=P.x+'%';b.style.top=P.y+'%';b.style.setProperty('--c',MAPCOL[P.color]||MAPCOL.gold);b.dataset.i=i;
   b.innerHTML=`<span class="d"></span><span class="n">${i+1}</span><span class="l">${esc(P.label||'pin '+(i+1))}</span>`;
   pw.append(b)});
  vw.textContent='';
  const vh=(k,r,i,p)=>{const b=document.createElement('button');b.type='button';b.className='mvert';
   b.dataset.k=k;b.dataset.r=r;b.dataset.i=i;b.style.left=p[0]+'%';b.style.top=p[1]+'%';return b};
  if(draft)draft.forEach((p,i)=>vw.append(vh('d','',i,p)));
  if(mode==='region'&&sel&&sel.t==='reg'){const R=S.regions[sel.i];if(R)R.pts.forEach((p,i)=>vw.append(vh('r',sel.i,i,p)))}
  cv.classList.toggle('regmode',mode==='region');
  cv.classList.toggle('drawing',!!draft);
  const o=curObj();
  const rd=q('#mp_pos');if(rd&&o&&sel&&sel.t==='pin')rd.textContent=o.x.toFixed(1)+'%, '+o.y.toFixed(1)+'%';
  const re=q('.mrow.on>em');if(re&&o)re.textContent=sel.t==='pin'?o.x.toFixed(1)+','+o.y.toFixed(1):o.pts.length+' pts';
 }
 function wire(){
  const at=e=>{const r=cv.getBoundingClientRect();return[clamp((e.clientX-r.left)/r.width*100),clamp((e.clientY-r.top)/r.height*100)]};
  let dg=null;
  cv.addEventListener('pointerdown',e=>{
   const vt=e.target.closest('.mvert');
   if(vt){dg={k:'v',kind:vt.dataset.k,r:vt.dataset.r,i:+vt.dataset.i};cv.setPointerCapture(e.pointerId);e.preventDefault();return}
   const pg=e.target.closest('.mpoly');
   if(pg&&!draft){sel={t:'reg',i:+pg.dataset.i};mode='region';redraw();return}
   const pn=e.target.closest('.mpin');
   if(pn){sel={t:'pin',i:+pn.dataset.i};mode='pin';draft=null;dg={k:'p',i:+pn.dataset.i};cv.setPointerCapture(e.pointerId);redraw();return}
   const p=at(e);
   if(mode==='region'){if(!draft)draft=[];draft.push(p);lastAdd=Date.now();sel=null;redraw()}
   else{S.pins.push({x:p[0],y:p[1],label:'',note:'',href:'',color:'gold',era:'',mid:''});sel={t:'pin',i:S.pins.length-1};redraw()}
  });
  cv.addEventListener('pointermove',e=>{
   if(dg){const p=at(e);
    if(dg.k==='p'){S.pins[dg.i].x=p[0];S.pins[dg.i].y=p[1]}
    else if(dg.kind==='r'){S.regions[+dg.r].pts[dg.i]=p}
    else if(draft)draft[dg.i]=p;
    syncGeom();return}
   if(draft){const p=at(e);band.setAttribute('points',draft.map(z=>z[0]+','+z[1]).concat([p[0]+','+p[1]]).join(' '))}
  });
  cv.addEventListener('pointerup',()=>{dg=null});
  cv.addEventListener('pointercancel',()=>{dg=null});
  cv.addEventListener('dblclick',()=>{if(!draft)return;if(Date.now()-lastAdd<600&&draft.length>2){draft.pop();draft.pop()}finish()});
 }
 function finish(){
  if(!draft||draft.length<3){stErr('A border needs at least 3 corners.');return}
  S.regions.push({pts:draft.map(p=>[p[0],p[1]]),label:'',note:'',href:'',color:'gold',era:'',mid:''});
  sel={t:'reg',i:S.regions.length-1};draft=null;mode='region';redraw();
}

 /* ---------- panels ---------- */

  <label>Label</label><input type="text" data-f="label" value="${esc(o.label)}" placeholder="${t==='pin'?'Place name':'Region name'}">

  </div>`;
 function drawItems(){
  const box=q('#mp_items');
  const a=box.querySelector('#ms_p1'),b=box.querySelector('#ms_p2'),oP=a?a.open:1,oR=b?b.open:1;
  const row=(t,i,o)=>`<div class="mrow${sel&&sel.t===t&&sel.i===i?' on':''}" data-t="${t}" data-i="${i}"><i style="--c:${MAPCOL[o.color]||MAPCOL.gold}"></i><b>${esc(o.label||(t==='pin'?'Pin '+(i+1):'Region '+(i+1)))}</b><em>${t==='pin'?o.x.toFixed(1)+','+o.y.toFixed(1):o.pts.length+' pts'}</em><button type="button" class="x" data-del="1" title="Delete">✕</button></div>`;
  box.innerHTML=`
  <details class="ms-sec" id="ms_p1"${oP?' open':''}><summary>Pins (${S.pins.length})</summary>
   <div style="margin-top:8px">${S.pins.map((p,i)=>row('pin',i,p)).join('')||'<p class="msg" style="margin:6px 0">Click the map to drop a pin.</p>'}</div>
   <div class="row" style="margin-top:8px"><button type="button" id="mp_ap">+ Add pin at the centre</button></div>
   ${sel&&sel.t==='pin'?formFor(S.pins[sel.i],'pin'):''}
  </details>
  <details class="ms-sec" id="ms_p2"${oR?' open':''}><summary>Regions &amp; borders (${S.regions.length})</summary>
   <div style="margin-top:8px">${S.regions.map((r,i)=>row('reg',i,r)).join('')||'<p class="msg" style="margin:6px 0">The shaded, labelled areas of the site maps — click one on the map to edit it.</p>'}</div>
   <div class="row" style="margin-top:8px"><button type="button" id="mp_ag">✎ Draw a new border</button></div>
   ${sel&&sel.t==='reg'?formFor(S.regions[sel.i],'reg'):''}
  </details>`;
  box.querySelectorAll('.mrow').forEach(r=>r.onclick=e=>{if(e.target.closest('[data-del]'))return;
   sel={t:r.dataset.t,i:+r.dataset.i};mode=sel.t==='reg'?'region':'pin';if(mode==='pin')draft=null;redraw()});
  box.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{const r=x.closest('.mrow'),t=r.dataset.t,i=+r.dataset.i;
   if(t==='pin')S.pins.splice(i,1);else S.regions.splice(i,1);sel=null;redraw()});
  box.querySelectorAll('[data-f]').forEach(f=>f.oninput=()=>{const o=curObj();if(!o)return;o[f.dataset.f]=f.value;
   const rb=box.querySelector('.mrow.on>b');if(rb)rb.textContent=o.label||(sel.t==='pin'?'Pin '+(sel.i+1):'Region '+(sel.i+1));syncGeom()});
  box.querySelectorAll('[data-c]').forEach(x=>x.onclick=()=>{const o=curObj();if(!o)return;o.color=x.dataset.c;redraw()});
  box.querySelectorAll('[data-nud]').forEach(x=>x.onclick=()=>{const o=curObj();if(!o)return;const d=x.dataset.nud,s=d[1]==='+'?1:-1;
   if(d[0]==='x')o.x=clamp(o.x+s);else o.y=clamp(o.y+s);syncGeom()});
  box.querySelectorAll('[data-addv]').forEach(x=>x.onclick=()=>{const o=curObj();if(!o)return;o.pts.push([50,50]);redraw()});
  const ap=q('#mp_ap');if(ap)ap.onclick=()=>{S.pins.push({x:50,y:50,label:'',note:'',href:'',color:'gold',era:'',mid:''});sel={t:'pin',i:S.pins.length-1};mode='pin';redraw()};
  const ag=q('#mp_ag');if(ag)ag.onclick=startDraw;
 }
 function drawArt(){
  const c=q('#mp_arts');if(!c)return;
  c.querySelectorAll('button[data-b]').forEach(b=>{
   const k=b.dataset.b,s=(S.src&&baseOf(S.src)===k)?S.src:pickSrc(k);
   if(!s)return;
   b.dataset.s=s;
   const im=b.querySelector('img');if(im&&im.getAttribute('src')!==raw(s))im.setAttribute('src',raw(s));
   const lb=b.querySelector('b');if(lb)lb.textContent=s.split('/').pop().replace(/\.[a-z]+$/i,'');
   b.classList.toggle('on',S.src===s);
  });
  const n=c.querySelector('button[data-none]');if(n)n.classList.toggle('on',!S.src);
  const want=(S.src&&!(baseOf(S.src) in byBase))?S.src:'';
  let cu=c.querySelector('button[data-custom]');
  if(want&&!cu){cu=document.createElement('button');cu.type='button';cu.dataset.custom='1';c.append(cu)}
  if(cu){if(!want)cu.remove();else{cu.dataset.s=want;cu.innerHTML=`<span class="ph">◈</span><b>${esc(want.split('/').pop())}</b>`;cu.classList.toggle('on',S.src===want)}}
 }
 function drawBars(){
  m.querySelectorAll('[data-mo]').forEach(b=>b.classList.toggle('on',b.dataset.mo===mode));
  const dr=!!draft;
  q('#mp_hint').textContent=mode==='pin'
   ? 'Click the map to drop a pin — drag it to fine-tune, click it to edit.'
   : dr?'Adding corners — drag them to reshape, then Close border (Esc cancels).'
       : 'Click a shaded area to select it, or press “Start a new border” and click to add corners.';
  const d=q('#mp_draw');d.style.display=mode==='region'?'flex':'none';
  q('#mp_new').style.display=dr?'none':'';
  ['mp_undo','mp_drop','mp_fin'].forEach(i=>q('#'+i).style.display=dr?'':'none');
  q('#mp_undo').disabled=!draft||!draft.length;
  q('#mp_fin').disabled=!draft||draft.length<3;

  srcLang==='en'&&tgtLang==='fa'?'English→Farsi: natural encyclopedia Persian; established FA names (زرتشت, مهر, …) when the FA tree already uses them.':'',
  srcLang==='fa'&&tgtLang==='en'?'Farsi→English: clear literary English; names consistent with the English content tree.':''
 ].filter(Boolean);
 let agentNote='';
 if(agent==='claude')agentNote='Claude: keep the checklist; output only the finished Markdown file (optionally wrap in a single ```markdown fence). Do not summarise — translate everything.';
 else if(agent==='gpt')agentNote='ChatGPT / GPT: same contract as Claude. If the model truncates, ask it to continue from the last heading without repeating earlier sections.';
 else if(agent==='gemini')agentNote='Gemini: paste as one brief + the full source. Ask for the complete file back; if length-limited, continue section by section in order.';
 else agentNote='Generic agent: follow the rules, return the full translated Markdown file for the target path.';
 const prompt=[
  `# Haoma translation brief (follow translate-ai.md)`,
  ``,
  `## Task`,
  `Translate the Haoma page below from **${srcName}** (\`${srcLang}\`) to **${tgtName}** (\`${tgtLang}\`).`,
  ``,
  `## Paths`,
  `- Source: \`${path}\``,
  `- Write result as: \`${outPath}\``,
  ``,
  `## Model notes`,
  agentNote,
  ``,
  notes?`## Extra instructions from the editor\n${notes}\n`:'',
  `## Rules`,
  ...rules.map(r=>`- ${r}`),
  ``,
  `## Checklist before accept`,
  `- [ ] Full front matter + body`,
  `- [ ] Shortcodes still valid; site-root paths unchanged`,
  `- [ ] grade: draft (machine-assisted)`,
  `- [ ] Title/tagline in ${tgtName}; structural keys untouched`,
  ``,
  `## Source document (translate in full)`,
  ``,
  '```markdown',
  body.replace(/\s+$/,''),
  '```'
 ].filter(v=>v!==undefined).join('\n');
 const howto=`Paste into your ${agent} agent with translate-ai.md in context if possible. Save the reply to ${outPath} (create stub from Content if missing, then replace). Keep grade: draft until a native check.`;
 return{prompt,howto,spec:`${srcLang} → ${tgtLang} · ${path} → ${outPath} · agent ${agent}`,outPath,srcLang,tgtLang};
}
