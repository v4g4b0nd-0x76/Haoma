<style>
:root{--bg:#0f1115;--s:#171a20;--s2:#1e222a;--b:#2b303a;--t:#d6d9e0;--m:#8a909c;--a:#7fa8c9;--ok:#6fbf8b;--bad:#e06c6c;--warn:#e0b45a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;height:100vh;overflow:hidden}
button,select,input,textarea{font:inherit;color:var(--t);background:var(--bg);border:1px solid var(--b);border-radius:8px;padding:6px 11px}
button{cursor:pointer;background:var(--s2)}button:hover{border-color:var(--a)}button.pri{background:var(--a);color:#0b0d10;border-color:var(--a);font-weight:600}button.link{background:none;border:0;color:var(--a);padding:0}
input:focus,textarea:focus,select:focus{outline:2px solid var(--a);outline-offset:-1px}
#app{display:grid;grid-template-columns:210px 290px 1fr;height:100vh}#app.nolist{grid-template-columns:210px 1fr}#app.nolist #panel{display:none}
/* no backend: the file panel has nothing to list, so it is not shown at all */
#app.static{grid-template-columns:210px 1fr}#app.static #panel{display:none}
#app.pv{grid-template-columns:210px 290px 1fr 1fr}#app.pv.nolist{grid-template-columns:210px 1fr 1fr}
#rail{background:var(--s);border-right:1px solid var(--b);display:flex;flex-direction:column;padding:12px 8px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;padding:6px 10px 14px;color:#e0a03a}.logo svg{width:30px;height:30px}#rl{flex:1}
.rb{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:9px 10px;margin:1px 0;color:var(--m)}
.rb span{width:22px;text-align:center}.rb:hover{background:var(--s2);color:var(--t)}.rb.on{background:var(--s2);color:var(--a);box-shadow:inset 3px 0 var(--a)}
.rbot{border-top:1px solid var(--b);padding-top:10px;display:grid;gap:6px}.rbot button{width:100%}#branch{color:var(--m);font-size:12px;padding:0 4px}
#panel{background:var(--s);border-right:1px solid var(--b);overflow:auto;padding:12px}#main{overflow:auto;padding:22px 26px;min-width:0}
#pvwrap{display:none;border-left:1px solid var(--b);flex-direction:column;min-width:0}#app.pv #pvwrap{display:flex}#pvwrap iframe{flex:1;border:0;background:#fff}#pvwrap .row{padding:8px;background:var(--s)}
label{display:block;margin:10px 0 3px;color:var(--m);font-size:12px}input[type=text],select,textarea{width:100%}
.row{display:flex;gap:8px;align-items:center}.row>input,.row>select{flex:1}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.item{display:block;width:100%;text-align:left;border:0;background:none;padding:4px 8px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item:hover{background:var(--s2)}.item.on{color:var(--a);background:var(--s2)}
summary{cursor:pointer;color:var(--m);padding:3px 4px;font-size:12px;text-transform:uppercase;letter-spacing:.05em}summary.s2{text-transform:none;font-size:13px;color:var(--t);letter-spacing:0;padding-left:10px}details details{margin-left:6px}
.grp{color:var(--m);font-size:12px;margin:14px 0 4px;text-transform:uppercase;letter-spacing:.05em}.msg{color:var(--m);margin-left:8px}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
button:disabled{opacity:.45;cursor:not-allowed}
pre{background:var(--s);border:1px solid var(--b);padding:12px;border-radius:8px;overflow:auto;max-height:50vh;white-space:pre-wrap;font-size:12.5px}
.card{background:var(--s);border:1px solid var(--b);border-radius:12px;margin:12px 0;overflow:hidden}.card.pad{padding:14px 16px}.card .bn{height:90px;background:#000 center/cover}.card div.t{padding:10px 14px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}.crumb{color:var(--m);font-size:13px}h2{margin:.1em 0 .6em;font-size:22px}h3{margin:.2em 0 .6em}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.stat{background:var(--s);border:1px solid var(--b);border-radius:12px;padding:14px;text-align:left;cursor:pointer}.stat b{display:block;font-size:28px}.stat span{color:var(--m)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.chip{border-radius:99px;padding:3px 13px;font-size:13px}.chip.on{background:var(--a);color:#0b0d10;border-color:var(--a)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--b)}tr.go{cursor:pointer}tr.go:hover{background:var(--s)}th{color:var(--m);font-weight:500;font-size:12px}
.tag{display:inline-block;border:1px solid var(--b);border-radius:99px;padding:0 8px;font-size:11px;margin-right:4px;color:var(--warn)}
.sw{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}.sw input[type=color]{width:100%;height:32px;padding:2px}
textarea.ed{height:calc(100vh - 340px);min-height:240px}textarea.mono,textarea.ed{font:13px/1.6 ui-monospace,Menlo,Consolas,monospace;resize:vertical;tab-size:2}.tb{display:flex;gap:6px;margin:10px 0 6px;flex-wrap:wrap}
.bdg{margin-left:auto;font-style:normal;color:var(--warn);font-size:12px}.pend{background:var(--s2);border:1px solid var(--warn);border-radius:8px;padding:8px}.pend b{color:var(--warn);display:block;margin-bottom:6px}.pend .row button{flex:1;padding:4px}
.sep{width:1px;background:var(--b);margin:0 4px}code{background:var(--s2);padding:1px 6px;border-radius:5px}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50}.mdl{background:var(--s);border:1px solid var(--b);border-radius:14px;width:min(760px,94vw);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--b)}.mh .x{border:0;background:none;font-size:16px}.mb{padding:14px 18px;overflow:auto}.mf{padding:12px 18px;border-top:1px solid var(--b);display:flex;gap:8px;align-items:center}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin:10px 0;max-height:210px;overflow:auto}.mi{position:relative;padding:4px;border-radius:10px;display:flex;flex-direction:column;gap:3px;text-align:center;font-size:11px}.mi img,.mi .vt{width:100%;height:64px;object-fit:cover;border-radius:7px;background:#000;display:flex;align-items:center;justify-content:center;font-size:24px}.mi span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mi.on{border-color:var(--a);background:var(--s2)}.mi i{position:absolute;top:6px;right:6px;background:var(--a);color:#0b0d10;font-style:normal;font-weight:700;border-radius:99px;min-width:20px;padding:0 5px;font-size:12px}
.gpick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.gp{padding:8px;text-align:center;font-size:12px;display:flex;flex-direction:column;gap:6px}.gp.on{border-color:var(--a);background:var(--s2)}.gm{display:grid;gap:3px;height:46px}.gm i{background:var(--b);border-radius:3px;min-height:12px}.gm i.i{background:var(--a);opacity:.65}.gm i.h{background:var(--m);opacity:.5;min-height:10px}
/* ===== myth map studio ===== */
.mdl.wide{width:min(1340px,96vw);max-height:94vh;--a:#e0a03a;--s2:#1c1b18}
.mdl.wide .mh b{font:600 17px Georgia,serif;letter-spacing:.01em;color:#ecc98a}
.ms-grid{display:grid;grid-template-columns:minmax(0,1fr) 326px;gap:18px;align-items:start}
.ms-stage{background:radial-gradient(130% 130% at 50% 0%,#181c24,#0d0f13);border:1px solid var(--b);border-radius:14px;padding:14px;display:flex;justify-content:center;min-height:260px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.ms-canvas{position:relative;border-radius:8px;outline:1px solid rgba(224,160,58,.45);box-shadow:0 16px 46px rgba(0,0,0,.6);background:#0a0c10;cursor:crosshair;touch-action:none}
.ms-canvas>img{display:block;width:100%;height:100%;border-radius:8px;background:#0a0c10}
.ms-canvas.noart>img{display:none}
.ms-canvas.noart{display:flex;align-items:center;justify-content:center;padding:18px;color:#93896a;font:italic 14px/1.7 Georgia,serif;text-align:center;letter-spacing:.03em}
.ms-ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.mpoly{pointer-events:none;cursor:pointer}
.regmode .mpoly{pointer-events:auto}
.regmode.drawing .mpoly{pointer-events:none}
.mpoly polygon{fill:var(--c);fill-opacity:.13;stroke:var(--c);stroke-width:1.6;stroke-dasharray:5 4;vector-effect:non-scaling-stroke}
.mpoly.on polygon{fill-opacity:.32;stroke-width:2.6;stroke-dasharray:none}
.mroute{fill:none;stroke:#f0d79a;stroke-width:1.6;stroke-dasharray:6 5;vector-effect:non-scaling-stroke;opacity:.85}
.mdraft{fill:#e0a03a;fill-opacity:.13;stroke:#e0a03a;stroke-width:1.6;stroke-dasharray:3 3;vector-effect:non-scaling-stroke}
.mdraftband{fill:none;stroke:#e0a03a;stroke-width:1.4;stroke-dasharray:3 3;vector-effect:non-scaling-stroke;opacity:.8}
.ms-pins{position:absolute;inset:0;pointer-events:none}
.mpin{position:absolute;transform:translate(-50%,-50%);background:none;border:0;padding:7px;cursor:grab;line-height:0;color:inherit;pointer-events:auto}
.regmode .mpin{pointer-events:none}
.mpin .d{display:block;width:11px;height:14px;background:var(--c);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;box-shadow:0 0 0 2px #0a0c10,0 0 12px var(--c)}
.mpin .n{position:absolute;top:-5px;left:50%;transform:translateX(-50%);font:700 9px/12px system-ui;color:#0a0c10;background:var(--c);border-radius:99px;min-width:12px;padding:0 2px;pointer-events:none}
.mpin .l{position:absolute;top:100%;left:50%;transform:translateX(-50%);font:600 11px/1.3 Georgia,serif;color:#f2ead8;white-space:nowrap;text-shadow:0 1px 4px #000,0 0 10px rgba(0,0,0,.9);pointer-events:none}
.mpin.on .d{box-shadow:0 0 0 2px #e0a03a,0 0 20px var(--c)}
.mpin.on .l{text-decoration:underline;text-underline-offset:3px}
.ms-verts{position:absolute;inset:0;pointer-events:none}
.mvert{position:absolute;width:12px;height:12px;transform:translate(-50%,-50%);background:#e0a03a;border:2px solid #0a0c10;border-radius:3px;cursor:grab;pointer-events:auto;padding:0;box-shadow:0 0 8px rgba(0,0,0,.7)}
.mvert:hover{transform:translate(-50%,-50%) scale(1.35)}
.ms-bar{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
.ms-modes{display:flex;gap:4px;background:var(--s2);border:1px solid var(--b);border-radius:10px;padding:3px}
.ms-modes button{border:0;background:none;padding:6px 14px;border-radius:8px;font-size:13px;color:var(--m)}
.ms-modes button.on{background:var(--a);color:#14161a;font-weight:600}
.ms-hint{color:var(--m);font-size:12.5px}
.ms-arts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:264px;overflow:auto;padding:2px}
.ms-arts button{padding:5px;border-radius:10px;background:none;border:1px solid transparent;cursor:pointer;text-align:left}
.ms-arts .ph{display:flex;height:46px;align-items:center;justify-content:center;background:#12141a;border-radius:6px;font-size:18px;color:var(--m);overflow:hidden}
.ms-arts img{display:block;width:100%;height:46px;object-fit:cover;border-radius:6px;background:#000}
.ms-arts b{display:block;font-weight:500;font-size:10.5px;color:var(--m);line-height:1.3;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms-arts button.on{border-color:var(--a);background:var(--s2)}
.ms-arts button.on b{color:var(--a)}
.msw{display:flex;gap:6px}
.msw button{width:24px;height:24px;border-radius:50%;border:2px solid transparent;background:var(--c);cursor:pointer;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.msw button.on{border-color:#fff;box-shadow:0 0 0 2px var(--c)}
.ms-items{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
.ms-sec>summary{cursor:pointer;color:var(--m);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding:2px 0}
.ms-set h4{margin:16px 0 6px;font:700 11.5px system-ui;letter-spacing:.06em;text-transform:uppercase;color:var(--m)}
.ms-set h4:first-child{margin-top:0}
.ms-set .lab{margin:12px 0 3px;display:block}
.mrow{display:flex;gap:8px;align-items:center;padding:5px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.mrow:hover{background:var(--s2)}
.mrow.on{background:var(--s2);border-color:var(--a)}
.mrow>i{width:11px;height:11px;border-radius:50%;background:var(--c);flex:0 0 auto;box-shadow:0 0 8px var(--c)}
.mrow>b{flex:1;font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow>em{font-style:normal;color:var(--m);font-size:11.5px;font-family:ui-monospace,Menlo,monospace}
.mrow .x{border:0;background:none;color:var(--m);padding:0 2px;line-height:1}
.mrow .x:hover{color:#e05040}
.mform{border-top:1px dashed var(--b);margin-top:8px;padding-top:8px}
.mform label{margin:8px 0 2px}
.mp-read{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--warn)}
.mp-posbtn{padding:4px 7px;font-size:11px;line-height:1}

<script>const T=document.querySelector('meta[name=token]').content;

async function api(p,o={}){const r=await fetch('/api/'+p,{...o,headers:{'X-Token':T}});const ct=r.headers.get('content-type')||'';const d=ct.includes('json')?await r.json():await r.text();if(!r.ok)throw new Error(d.error||d);return d}

const q=s=>JSON.stringify(s),slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''),today=()=>new Date().toISOString().slice(0,10),nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const say=(t,c='')=>{$('#hmsg').className='msg '+c;/* collapse and clamp: a failed request can hand back a whole HTML error page, and it must never fill the rail */$('#hmsg').textContent=String(t).replace(/\s+/g,' ').trim().slice(0,300)};

let files=[],orig={},drafts=new Map(),git={},audit=[],cur=null,view='dash',rf='all',cT=null,cN='en',timers={};

const J=p=>drafts.has(p)?drafts.get(p):orig[p];
const themes=()=>JSON.parse(J('data/themes.json')),
/* nav.json may be missing or empty: never throw, always give every language a (possibly empty) menu so the "+ Add link" button is always reachable */
nav=()=>{let v;try{v=JSON.parse(J('data/nav.json'))}catch(e){}if(!v||typeof v!=='object'||Array.isArray(v))v={};if(!Object.keys(v).length)v={en:[],fa:[]};return v},
site=()=>{try{return JSON.parse(J('data/site.json'))}catch(e){return{repo:'',branch:'master'}}};
const setJ=(p,o)=>setDraft(p,JSON.stringify(o,null,2));
const allFiles=()=>{const s=new Set(files);drafts.forEach((v,p)=>v===null?s.delete(p):s.add(p));return[...s].sort()};
function setDraft(p,v){const o=orig[p];if(typeof v==='string'&&o!==undefined&&v===o){drafts.delete(p);clearTimeout(timers[p]);api('discard?path='+E(p),{method:'POST'}).catch(()=>{})}else{drafts.set(p,v);clearTimeout(timers[p]);if(!(v&&v.bin))timers[p]=setTimeout(()=>push(p),450)}pend()}
async function push(p){clearTimeout(timers[p]);const v=drafts.get(p);if(v===undefined||(v&&v.bin))return;try{if(v===null)await api('draftdel?path='+E(p),{method:'POST'});else await api('draft?path='+E(p),{method:'PUT',body:v})}catch(e){say(e.message,'bad')}}
async function putBin(p,f){await api('draft?path='+E(p),{method:'PUT',body:f});drafts.set(p,{bin:true,name:f.name,size:f.size});pend()}
function pend(){const n=drafts.size;$('#pend').hidden=!n;$('#pend b').textContent='● '+n+' temporary draft'+(n>1?'s':'')}

async function discardPaths(paths){for(const p of paths){drafts.delete(p);clearTimeout(timers[p]);await api('discard?path='+E(p),{method:'POST'}).catch(()=>{})}await load();pend();refresh()}
async function loadDrafts(){const r=await api('drafts');drafts.clear();r.items.forEach(i=>drafts.set(i.path,i.kind==='del'?null:i.kind==='bin'?{bin:true,name:i.path.split('/').pop(),size:i.size}:i.text))}

const VIEWS={dash:['🏠','Dashboard',pDash,0],content:['📝','Content',pContent,1],drafts:['🗒','Drafts',pDrafts,0],themes:['🎨','Themes',pThemes,1],nav:['🧭','Navigation',pNav,1],review:['🔎','Review',pReview,0],files:['🗂','Files',pFiles,1],history:['↶','History',pHistory,0],publish:['🚀','Publish & PR',pPublish,0],settings:['⚙️','Settings',pSettings,0]};

function bindItems(){document.querySelectorAll('#panel .item').forEach(b=>b.onclick=()=>openFile(b.dataset.p))}
function ctree(paths,filter){const f=filter.toLowerCase(),g={};paths.filter(p=>p.toLowerCase().includes(f)).forEach(p=>{const m=p.match(/^content\/(\w+)\/(.*)$/),l=m?m[1]:'other',rest=m?m[2]:p,pt=rest.split('/'),k=pt[0]==='cultures'&&pt.length>2?'cultures / '+pt[1]:pt[0].replace(/\.md$/,'');g[l]=g[l]||{};(g[l][k]=g[l][k]||[]).push(p)});
 return Object.keys(g).sort().map(l=>`<details open><summary>${l}</summary>${Object.keys(g[l]).sort().map(k=>`<details ${f?'open':''}><summary class="s2">${esc(k)}</summary>${g[l][k].map(p=>`<button class="item ${p===cur?'on':''}" data-p="${esc(p)}" title="${esc(p)}">${drafts.has(p)?'● ':''}${esc(p.split('/').slice(-2).join('/').replace(/\.md$/,''))}</button>`).join('')}</details>`).join('')}</details>`).join('')}
function pContent(){const md=allFiles().filter(f=>f.startsWith('content/'));$('#panel').innerHTML=`<div class="row"><button class="pri" id="np">+ Page</button><button id="nc">+ Culture</button></div><input type="text" id="cs" placeholder="Search content…" style="margin-top:10px"><div id="ct" style="margin-top:8px">${ctree(md,'')}</div>`;bindItems();$('#np').onclick=wizPage;$('#nc').onclick=wizCulture;$('#cs').oninput=()=>{$('#ct').innerHTML=ctree(md,$('#cs').value);bindItems()}}
/* ===== dashboard / review ===== */
const issues={drafts:a=>a.draft&&!a.index,stale:a=>a.stale,nosrc:a=>!a.sources&&!a.index,untr:a=>a.missing.length&&!a.index};
function pDash(){const pg=audit.filter(a=>!a.index),n=k=>audit.filter(issues[k]).length,ch=(git.status||'').split('\n').filter(Boolean);
 $('#main').innerHTML=`<h2>Dashboard</h2><p class="msg" style="margin:0">Counts describe saved files. Unsaved edits live only in the editor and the preview.</p><div class="stats" style="margin-top:12px">${[['all','Pages',pg.length],['drafts','Drafts',n('drafts')],['stale','Need review',n('stale')],['nosrc','Without sources',n('nosrc')],['untr','Untranslated',n('untr')]].map(([k,l,v])=>`<button class="stat" data-r="${k}"><b>${v}</b><span>${l}</span></button>`).join('')}<button class="stat" data-v="publish"><b>${ch.length}</b><span>Uncommitted files</span></button></div>
 <h3 style="margin-top:22px">Quick actions</h3><div class="row" style="flex-wrap:wrap"><button class="pri" id="qp">+ New page</button><button id="qc">+ New culture</button><button id="qv">▶ Preview site</button><button id="qk">Check build</button>${site().repo?`<button id="qi">GitHub issues ↗</button><button id="qr">Pull requests ↗</button>`:''}</div>
 <h3 style="margin-top:22px">Uncommitted changes</h3><pre>${esc(ch.join('\n')||'Working tree clean')}</pre>`;
 document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{rf=b.dataset.r;view='review';render()});document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});
 $('#qp').onclick=()=>{view='content';render();wizPage()};$('#qc').onclick=()=>{view='content';render();wizCulture()};$('#qv').onclick=()=>$('#bpv').click();$('#qk').onclick=()=>$('#bchk').click();
 if(site().repo){$('#qi').onclick=()=>window.open(site().repo+'/issues');$('#qr').onclick=()=>window.open(site().repo+'/pulls')}}
function pReview(){const L={all:'All',drafts:'Drafts',stale:'Need review (older than 180 days)',nosrc:'No sources',untr:'Missing translation'};
 const rows=audit.filter(a=>!a.index&&(rf==='all'||issues[rf](a)));
 $('#main').innerHTML=`<h2>Review</h2><p class="msg" style="margin:0">Find pages that need a source, a translation or a fresh review.</p><div class="chips">${Object.keys(L).map(k=>`<button class="chip ${k===rf?'on':''}" data-r="${k}">${L[k]}</button>`).join('')}</div>
 <table><tr><th>Page</th><th>Lang</th><th>Grade</th><th>Reviewed</th><th>Flags</th></tr>${rows.map(a=>`<tr class="go" data-p="${esc(a.path)}"><td>${esc(a.title)}<br><span class="msg" style="margin:0">${esc(a.path.replace('content/',''))}</span></td><td>${a.lang}</td><td>${esc(a.grade)}</td><td>${esc(a.reviewed||'-')}</td><td>${a.draft?'<span class="tag">draft</span>':''}${a.stale?'<span class="tag">review</span>':''}${a.sources?'':'<span class="tag">no sources</span>'}${a.missing.map(m=>`<span class="tag">no ${m}</span>`).join('')}</td></tr>`).join('')||'<tr><td colspan=5 class="ok">Nothing to fix here.</td></tr>'}</table>`;
 document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{rf=b.dataset.r;pReview()});document.querySelectorAll('tr.go').forEach(r=>r.onclick=()=>openFile(r.dataset.p))}
/* ===== new page / culture wizards (create DRAFTS, not files) ===== */
const cultures=()=>Object.keys(themes()).filter(k=>k!=='base'),SECS=['characters','stories','history'],SECFA={characters:'شخصیت‌ها',stories:'داستان‌ها',history:'تاریخ'};
const cap=s=>s[0].toUpperCase()+s.slice(1);
const cultIdx=(cu,title,tag)=>`---\ntitle: ${q(title)}\nculture: ${cu}\nquote: ""\nquoteSource: ""\ntagline: ${q(tag||'')}\ncascade:\n  culture: ${cu}\n---\n\nAbout ${title}.\n`;
const secIdx=(l,s)=>`---\ntitle: ${q(l==='fa'&&SECFA[s]?SECFA[s]:cap(s))}\ncascade:\n  sec: ${s}\n---\n`;

const ensure=(p,t)=>{if(!allFiles().includes(p))setDraft(p,t)};
function wizPage(){$('#main').innerHTML=`<h2>New page</h2><p class="msg" style="margin:0">Created as an unsaved draft. Nothing is written to the project until you press Save.</p><div class="two"><div><label>Type</label><select id="ty"><option value="culture">Culture page (character, story, history…)</option><option value="episode">Podcast episode</option><option value="plain">Plain page</option></select>
<label>Language</label><select id="lg"><option value="en">English</option><option value="fa">فارسی</option></select><label>Culture</label><select id="cu">${cultures().map(c=>`<option>${c}</option>`).join('')}</select>
<label>Section</label><input type="text" id="se" list="sl" value="characters"><datalist id="sl">${SECS.map(s=>`<option>${s}</option>`).join('')}</datalist><label>Title</label><input type="text" id="ti"><label>URL name (a-z, 0-9, dashes)</label><input type="text" id="sg"></div>

<label>Sources (one per line)</label><textarea id="so" rows="4"></textarea><label><input type="checkbox" id="st" checked> also create a stub in the other language</label></div></div><p><button class="pri" id="go">Create draft</button><span id="wm" class="msg"></span></p>`;
 $('#ti').oninput=()=>{if(!$('#sg').dataset.m)$('#sg').value=slug($('#ti').value)};$('#sg').oninput=()=>$('#sg').dataset.m=1;$('#go').onclick=createPage}
function createPage(){try{const g=id=>$('#'+id).value.trim(),ty=g('ty'),lg=g('lg'),cu=g('cu'),sg=g('sg');if(!g('ti'))throw Error('a title is required');if(!/^[a-z0-9-]+$/.test(sg))throw Error('URL name: use a-z, 0-9 and dashes only');

<div><div class="sw"><div><label>Accent</label><input type="color" id="ac" value="#c9a45a"></div><div><label>Background</label><input type="color" id="bg" value="#15171a"></div></div><label>Background animation</label><select id="an"><option>fall</option><option>drift</option><option>rise</option><option>none</option></select><label>Top strip pattern</label><select id="pa"><option>none</option><option>meander</option><option>rosette</option><option>zigzag</option><option>waves</option></select>

const getK=(f,k)=>{const m=f.match(new RegExp('^'+k+':\\s*(.*)$','m'));if(!m)return'';let v=m[1].trim();if(v[0]==='"')try{v=JSON.parse(v)}catch(e){}return v};
const setK=(f,k,v)=>{const re=new RegExp('^'+k+':.*$','m');if(v===''&&!re.test(f))return f;const line=k+': '+(/^\d{4}-\d\d-\d\d$/.test(v)?v:JSON.stringify(v));return re.test(f)?f.replace(re,()=>line):(f?f+'\n':'')+line};
const getSrc=f=>{const m=(f+'\n').match(/^sources:\s*\n((?:[ \t]+- .*\n?)*)/m);if(m&&m[1])return m[1].split('\n').filter(Boolean).map(l=>{let v=l.replace(/^\s*-\s*/,'');try{v=JSON.parse(v)}catch(e){}return v});const i=f.match(/^sources:\s*\[(.*)\]/m);if(i)try{return JSON.parse('['+i[1]+']')}catch(e){}return[]};

function mattrs(s){const o={};let x,re=/([a-z]+)="([^"]*)"/g;while((x=re.exec(s)))o[x[1]]=x[2];return o}
function parseMap(txt){
 const h=/\{\{<\s*map\b([\s\S]*?)>\}\}/.exec(txt),A=mattrs(h?h[1]:''),st=h?h[0].length:0;
 const cl=txt.indexOf('{{<',st),body=txt.slice(st,cl<0?txt.length:cl),pins=[],regions=[];
 body.split('\n').forEach(l=>{const t=l.trim();
  if(/^pin\b/.test(t)){const a=mattrs(t);pins.push({x:parseFloat(a.x)||50,y:parseFloat(a.y)||50,label:a.label||'',note:a.note||'',href:a.href||'',color:a.color||'gold'})}
  else if(/^region\b/.test(t)){const a=mattrs(t);regions.push({pts:(a.points||'').split(/\s+/).map(s=>s.split(',').map(Number)).filter(p=>p.length===2&&isFinite(p[0])&&isFinite(p[1])),label:a.label||'',note:a.note||'',href:a.href||'',color:a.color||'gold'})}});
 return{id:A.id||'',src:A.src||'',width:A.width||'100%',height:A.height||'480px',theme:A.theme||'dark',route:A.route||'',pulse:A.pulse!=='false',caption:A.caption||'',pins,regions};
}

 /* ---------- canvas ---------- */
 function fit(){
  if(!cv||!el)return;
  const cs=getComputedStyle(el);
  const availW=el.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  if(availW<50)return;
  const maxH=Math.max(240,Math.min(window.innerHeight*0.48,520)-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom));
  let w=availW,h=w/AR;if(h>maxH){h=maxH;w=h*AR}
  cv.style.width=Math.round(w)+'px';cv.style.height=Math.round(h)+'px';
 }
 const refit=()=>mapDims(S.src).then(d=>{AR=d.w/d.h;fit()}).catch(()=>{});
 function buildStage(){
  el=q('#mp_stage');el.innerHTML='';
  cv=document.createElement('div');cv.className='ms-canvas';
  imgEl=document.createElement('img');imgEl.alt='';cv.append(imgEl);
  const ph=document.createElement('span');ph.className='noartph';ph.textContent='Procedural parchment map — choose artwork below, or upload your own';ph.style.display='none';cv.append(ph);
  ov=document.createElementNS(NS,'svg');ov.setAttribute('class','ms-ov');
  ov.setAttribute('viewBox','0 0 100 100');ov.setAttribute('preserveAspectRatio','none');
  dynG=document.createElementNS(NS,'g');ov.append(dynG);
  band=document.createElementNS(NS,'polyline');band.setAttribute('class','mdraftband');band.style.display='none';ov.append(band);
  cv.append(ov);
  pw=document.createElement('div');pw.className='ms-pins';cv.append(pw);
  vw=document.createElement('div');vw.className='ms-verts';cv.append(vw);

 }
 function syncGeom(){
  if(!cv)return;
  const ph=cv.querySelector('.noartph');
  if(S.src){imgEl.style.display='';if(ph)ph.style.display='none';cv.classList.remove('noart');
   if(imgEl.dataset.s!==S.src){imgEl.dataset.s=S.src;imgEl.src=raw(S.src)}}
  else{imgEl.style.display='none';imgEl.removeAttribute('src');delete imgEl.dataset.s;ph.style.display='';cv.classList.add('noart')}
  dynG.textContent='';
  const rp=routePts();
  if(rp.length>1){const pl=document.createElementNS(NS,'polyline');pl.setAttribute('class','mroute');pl.setAttribute('points',rp.map(p=>p.join(',')).join(' '));dynG.append(pl)}
  S.regions.forEach((R,i)=>{if(R.pts.length<3)return;
   const g=document.createElementNS(NS,'g');g.setAttribute('class','mpoly'+(sel&&sel.t==='reg'&&sel.i===i?' on':''));g.dataset.i=i;
   g.style.setProperty('--c',MAPCOL[R.color]||MAPCOL.gold);
   const pg=document.createElementNS(NS,'polygon');pg.setAttribute('points',R.pts.map(p=>p[0]+','+p[1]).join(' '));g.append(pg);dynG.append(g)});
  if(draft&&draft.length){const g=document.createElementNS(NS,'g');g.setAttribute('class','mdraft');
   const pg=document.createElementNS(NS,'polygon');pg.setAttribute('points',draft.map(p=>p[0]+','+p[1]).join(' '));g.append(pg);dynG.append(g);
   band.setAttribute('points',draft.map(p=>p[0]+','+p[1]).join(' '));band.style.display=''}
  else band.style.display='none';
  pw.textContent='';
  S.pins.forEach((P,i)=>{const b=document.createElement('button');b.type='button';
   b.className='mpin'+(sel&&sel.t==='pin'&&sel.i===i?' on':'');
   b.style.left=P.x+'%';b.style.top=P.y+'%';b.style.setProperty('--c',MAPCOL[P.color]||MAPCOL.gold);b.dataset.i=i;
   b.innerHTML=`<span class="d"></span><span class="n">${i+1}</span><span class="l">${esc(P.label||'pin '+(i+1))}</span>`;
   pw.append(b)});
  vw.textContent='';
  const vh=(k,r,i,p)=>{const b=document.createElement('button');b.type='button';b.className='mvert';
   b.dataset.k=k;b.dataset.r=r;b.dataset.i=i;b.style.left=p[0]+'%';b.style.top=p[1]+'%';return b};

 function wire(){
  const at=e=>{const r=cv.getBoundingClientRect();return[clamp((e.clientX-r.left)/r.width*100),clamp((e.clientY-r.top)/r.height*100)]};
  let dg=null;
  cv.addEventListener('pointerdown',e=>{
   const vt=e.target.closest('.mvert');
   if(vt){dg={k:'v',kind:vt.dataset.k,r:vt.dataset.r,i:+vt.dataset.i};cv.setPointerCapture(e.pointerId);e.preventDefault();return}
   const pg=e.target.closest('.mpoly');
   if(pg&&!draft){sel={t:'reg',i:+pg.dataset.i};mode='region';redraw();return}
   const pn=e.target.closest('.mpin');
   if(pn){sel={t:'pin',i:+pn.dataset.i};mode='pin';draft=null;dg={k:'p',i:+pn.dataset.i};cv.setPointerCapture(e.pointerId);redraw();return}
   const p=at(e);
   if(mode==='region'){if(!draft)draft=[];draft.push(p);lastAdd=Date.now();sel=null;redraw()}
   else{S.pins.push({x:p[0],y:p[1],label:'',note:'',href:'',color:'gold'});sel={t:'pin',i:S.pins.length-1};redraw()}
  });
  cv.addEventListener('pointermove',e=>{
   if(dg){const p=at(e);
    if(dg.k==='p'){S.pins[dg.i].x=p[0];S.pins[dg.i].y=p[1]}
    else if(dg.kind==='r'){S.regions[+dg.r].pts[dg.i]=p}
    else if(draft)draft[dg.i]=p;
    syncGeom();return}
   if(draft){const p=at(e);band.setAttribute('points',draft.map(z=>z[0]+','+z[1]).concat([p[0]+','+p[1]]).join(' '))}
  });
  cv.addEventListener('pointerup',()=>{dg=null});
  cv.addEventListener('pointercancel',()=>{dg=null});
  cv.addEventListener('dblclick',()=>{if(!draft)return;if(Date.now()-lastAdd<600&&draft.length>2){draft.pop();draft.pop()}finish()});
 }
 function finish(){
  if(!draft||draft.length<3){stErr('A border needs at least 3 corners.');return}
  S.regions.push({pts:draft.map(p=>[p[0],p[1]]),label:'',note:'',href:'',color:'gold'});
  sel={t:'reg',i:S.regions.length-1};draft=null;mode='region';redraw();

   const k=b.dataset.b,s=(S.src&&baseOf(S.src)===k)?S.src:pickSrc(k);
   if(!s)return;

   const im=b.querySelector('img');if(im&&im.getAttribute('src')!==raw(s))im.setAttribute('src',raw(s));
   const lb=b.querySelector('b');if(lb)lb.textContent=s.split('/').pop().replace(/\.[a-z]+$/i,'');
   b.classList.toggle('on',S.src===s);
  });

async function undo(id){const n=id?'this change and everything after it':'the last saved change';if(!confirm('Roll back '+n+'?'))return;try{const r=await api('rollback'+(id?'?id='+id:''),{method:'POST'});r.paths.forEach(p=>{drafts.delete(p);delete orig[p]});await load();pend();say('Rolled back: '+r.undone.join(', '),'ok');render()}catch(e){say(e.message,'bad')}}
async function pHistory(){const h=(await api('history')).items;$('#main').innerHTML=`<h2>History</h2><p class="msg" style="margin:0">Every Save is recorded. Rolling back restores the files exactly as they were before that change (it undoes newer changes too).</p><div class="row" style="margin:12px 0"><button class="pri" id="u1" ${h.length?'':'disabled'}>↶ Undo last change</button></div>
 <table><tr><th>When</th><th>Change</th><th>Files</th><th></th></tr>${h.map(t=>`<tr><td>${new Date(t.time*1000).toLocaleString()}</td><td>${esc(t.label)}</td><td>${t.files.map(f=>`<div class="msg" style="margin:0">${esc(f)}</div>`).join('')}</td><td><button data-id="${t.id}">Roll back to before this</button></td></tr>`).join('')||'<tr><td colspan=4 class="msg">No saved changes yet.</td></tr>'}</table>`;

 ${repo?`<p><button class="link" onclick="window.open('${repo}/issues')">Issues ↗</button> · <button class="link" onclick="window.open('${repo}/pulls')">Pull requests ↗</button></p>`:''}`;
 if(un)$('#sa2').onclick=()=>commit([...drafts.keys()],'Save '+un+' changes').then(pPublish);
 const setBr=()=>{$('#br').value=$('#md').value==='pr'?'fix/'+(slug($('#cm').value)||'update').slice(0,40):(git.branch||'master')};setBr();$('#md').onchange=setBr;$('#cm').oninput=()=>{if($('#md').value==='pr')setBr()};
 $('#a1').onclick=()=>$('#bpv').click();$('#a2').onclick=()=>$('#bchk').click();$('#a3').onclick=async()=>{if(drafts.size&&!confirm('Pulling resets the preview copy; your unsaved edits stay in the editor. Continue?'))return;const r=await api('pull',{method:'POST'});await load();$('#am').textContent=r.output.split('\n').pop();$('#am').className='msg '+(r.ok?'ok':'bad');drafts.forEach((v,p)=>push(p))};
 $('#df').onclick=async()=>{$('#main').insertAdjacentHTML('beforeend','<pre id="dp"></pre>');$('#dp').textContent=(await api('diff')).diff||'No tracked changes (new files are listed above).'};

  if(r.ok&&pr&&$('#ps').checked&&repo){const u=`${repo}/compare/${site().branch||'master'}...${b}?expand=1&title=${E($('#cm').value)}`;$('#prl').innerHTML=`<p><button class="pri" onclick="window.open('${u}')">Open pull request on GitHub ↗</button></p>`}await load()}catch(e){$('#co').textContent=e.message;$('#co').className='bad'}}}

let pvOn=false,pvBase='';const DL='en';

  if(a==='stop'&&!s.running){pvOn=false;break}

/* ===== boot =====
   This same file is published from GitHub Pages, where nothing answers /api.
   Failing to reach a backend is therefore normal, not an error: the panel asks
   once, and when there is nothing behind the door it says so in one calm view
   instead of dumping the static server's error page into the message line and
   leaving an empty body. */
function staticMode(){
  $('#app').classList.add('static');
  ['sa','da','bundo','bpv','bchk'].forEach(id=>{const b=document.getElementById(id);if(b)b.disabled=true});
  $('#rl').innerHTML='';
  const n=Object.keys(VIEWS).filter(k=>!hiddenPanels.has(k)).length;
  $('#main').innerHTML='<h2>Static preview</h2>'
    +'<p>This copy is published for reading, not for editing. It is the editor interface served as a plain file, with no backend behind it, so nothing here can read or change the project.</p>'
    +'<p>To use the editor, serve it from the repository root:</p>'
    +'<pre>python tools/editor.py</pre>'
    +'<p class="msg">That backend is what provides the file tree, drafts, search, preview, the build check and publishing. Without it those '+n+' views have nothing to show, so they are not offered.</p>'
    +'<p>Everything the editor writes is summarised in the repository <b>README.md</b> under &ldquo;The local editor\u201d.</p>';
  say('Static preview — no editor backend here','warn');
}
(async()=>{
  try{await api('resync',{method:'POST'})}catch(e){return staticMode()}
  await loadDrafts();await load();render();
  if(drafts.size)say('Restored '+drafts.size+' temporary draft(s)','warn');
})().catch(e=>say(e.message,'bad'));
