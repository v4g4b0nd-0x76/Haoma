name: Release editor binary

on:
  push:
    tags: ["editor-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: haoma-editor-linux-amd64
          - os: windows-latest
            asset: haoma-editor-windows-amd64.exe
            bin: haoma-editor.exe
          - os: macos-latest
            asset: haoma-editor-macos-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --onefile --name haoma-editor \
            --add-data "tools/admin.html:." \
            --noconfirm --clean tools/editor.py
          mv dist/haoma-editor "dist/${{ matrix.asset }}"
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --onefile --name haoma-editor `
            --add-data "tools/admin.html;." `
            --noconfirm --clean tools/editor.py
          Move-Item dist/haoma-editor.exe "dist/${{ matrix.asset }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/editor-v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect binaries
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -la dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('editor-nightly-{0}', github.run_id) }}
          name: Haoma editor ${{ github.ref_type == 'tag' && github.ref_name || format('nightly {0}', github.run_id) }}
          body: |
            Standalone Haoma editor binary — opens in your browser (no Python install).

            **Requirements still needed on your machine:**
            - [Hugo Extended](https://gohugo.io/installation/) ≥ 0.139
            - git

            **Usage:** place the binary in (or next to) a clone of this repo and run it, or set `HAOMA_ROOT` to the project folder.
          files: dist/*
          draft: ${{ github.event_name == 'workflow_dispatch' && github.ref_type != 'tag' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
