<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMid slice"><!-- Original art for this project: moonlit Greek night - Mount Olympus with snow caps and cloud terrace, the twelve gods assembled above the summit (Zeus with the bolt, Hera sceptred, Poseidon tridented, Athena helmeted with spear and shield, Apollo with the lyre, Artemis with the bow, Ares plumed, Aphrodite veiled, Hermes caduceused, Hephaestus with the hammer, Demeter torch-bearing, Dionysus thyrsus-bearing), a Spartan phalanx marching with crested Corinthian helmets and lambda shields, a Doric temple, Homer seated with his lyre beneath the opening words of the Iliad (public domain), an Achaean galley and the horse of Troy on the far shore, olive trees, and a meander frieze. One accent glow: the moon. --><style>
.t0{animation:tw 4s ease-in-out infinite alternate}.t1{animation:tw 6s ease-in-out infinite-reverse alternate}@keyframes tw{to{opacity:.15}}
.gl{animation:pl 7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}@keyframes pl{to{opacity:.5;transform:scale(1.1)}}
.cl{animation:cd 24s ease-in-out infinite alternate}.c2{animation-duration:30s;animation-delay:-11s}.c3{animation-duration:27s;animation-delay:-6s}@keyframes cd{to{transform:translateX(22px)}}
.gd{animation:gf 8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center bottom}.g2{animation-duration:9.5s;animation-delay:-3s}.g3{animation-duration:7.4s;animation-delay:-5s}.g4{animation-duration:10s;animation-delay:-7s}@keyframes gf{to{transform:translateY(-2px)}}
.hp{animation:hb 3.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center bottom}.h2{animation-delay:-1.7s}@keyframes hb{to{transform:translateY(-1.4px)}}
.sh{animation:shb 5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}@keyframes shb{to{transform:translateY(-1.6px) rotate(.6deg)}}
.il{opacity:.45}.i2{animation-delay:-3s}.i3{animation-delay:-6s}@keyframes ilf{to{opacity:.7}}.il{animation:ilf 9s ease-in-out infinite alternate}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs>
