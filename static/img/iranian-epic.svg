<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><!-- Refs: Mehr sun disc (Mihr Yasht); Simurgh over the Alborz; Damavand with smoke and coils (Zahhak chained); Derafsh Kaviani of Kaveh the blacksmith on its spear, with his hammer; Rostam on Rakhsh with his mace; the White Div and eyes of divs in the rocks; Zarathustra before the fire with three sparks (good thoughts, words, deeds); Ahriman as a serpent piercing the sky; creeping mist = evil (shar, druj); cypress --><style>
.rays{animation:sp 140s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes sp{to{transform:rotate(360deg)}}
.glow{animation:pl 7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}@keyframes pl{to{opacity:.5;transform:scale(1.1)}}
.sim{animation:fl 12s ease-in-out infinite alternate}@keyframes fl{to{transform:translate(-30px,-8px)}}
.flag{animation:wv 4.5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:left center}@keyframes wv{from{transform:skewY(-4deg)}to{transform:skewY(3deg) scaleX(.96)}}
.sm{animation:up 10s ease-out infinite;opacity:0;transform-box:fill-box;transform-origin:center}.s2{animation-delay:-3.3s}.s3{animation-delay:-6.6s}
@keyframes up{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:.32}100%{opacity:0;transform:translate(16px,-74px) scale(2.3)}}
.em{animation:rs 9s linear infinite;opacity:0}.e2{animation-duration:12s;animation-delay:-4s}.e3{animation-duration:15s;animation-delay:-8s}
@keyframes rs{0%{transform:translateY(0);opacity:0}15%{opacity:.8}100%{transform:translateY(-170px) translateX(18px);opacity:0}}
.rk{animation:bb 3.2s ease-in-out infinite alternate}@keyframes bb{to{transform:translateY(-1.6px)}}
.ah{animation:sl 20s ease-in-out infinite alternate}@keyframes sl{to{transform:translate(26px,7px)}}
.pu2{animation:p2 5s ease-in-out infinite alternate}@keyframes p2{to{opacity:.2}}
.ey{animation:bk 9s ease-in-out infinite;opacity:0}.y2{animation-delay:-3s}.y3{animation-delay:-6s}@keyframes bk{0%,70%,100%{opacity:0}78%,92%{opacity:.75}}
.ms{animation:md 24s ease-in-out infinite alternate}.m2{animation-duration:30s;animation-delay:-10s}@keyframes md{to{transform:translateX(60px)}}
.fk{animation:fq 1.3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes fq{to{transform:scale(.8,1.12)}}
.sk{animation:sk 5.5s ease-out infinite;opacity:0}.k2{animation-delay:-1.8s}.k3{animation-delay:-3.6s}@keyframes sk{0%{opacity:0;transform:translateY(0)}20%{opacity:.85}100%{opacity:0;transform:translateY(-38px)}}
.t0{animation:tw 4s ease-in-out infinite alternate}.t1{animation:tw 6s ease-in-out infinite alternate-reverse}@keyframes tw{to{opacity:.15}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
