<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="The cedar forest: tall trees, mist, and Huwawa's face in the canopy">
<!-- original art for this project: the cedar forest of Lebanon and Amanus, Tablet V -->
<defs>
  <linearGradient id="fsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e1620"/><stop offset="1" stop-color="#16241f"/></linearGradient>
  <linearGradient id="ftrunk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#241c14"/><stop offset="1" stop-color="#15100c"/></linearGradient>
  <radialGradient id="mist" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#9fc4c0" stop-opacity=".5"/><stop offset="1" stop-color="#9fc4c0" stop-opacity="0"/></radialGradient>
</defs>
<rect width="960" height="540" fill="url(#fsky)"/>
<!-- back rows of cedars -->
<g fill="#12211c">
  <path d="M80 380l-60-20q40-6 52-34q-30 6-44-8q34-14 38-44q-24 10-32-6q26-18 22-46q-16 14-20 2q14-30 2-52l20 30q-4-32 14-52l14 46q8-30 34-38q-16 22-6 32q26-16 44 2q-30 4-38 26q26-10 40 10q-28 0-38 20q24-4 34 16q-30-4-44 16q20 2 26 22q-30-8-46 10q14 4 12 24q-22-12-38 2q18 0 20 18q-20-6-32 8q10 4 6 18z"/>
  <path d="M880 390l54-18q-36-6-48-30q28-6 40-8q-30-14-34-40q22 10 30-6q-24-16-20-42q14 14 18 2q-12-28 0-48l-18 28q4-30-14-48l-12 42q-8-28-32-34q14 20 6 30q-24-16-40 2q28 4 34 24q-24-10-38 10q26 0 34 18q-22-4-30 14q22-4 42 14q-24 2-24 20z"/>
  <path d="M420 372l-50-16q34-6 44-28q-28 6-38-6q30-12 34-38q-22 8-28-4q24-16 20-40q-14 12-18 2q12-26 0-46l-16 26q4-28-12-44l-12 40q-8-26-30-32q12 18 6 28q-22-14-38 0q26 4 32 22q-22-8-34 10q24 0 30 16q-20-4-28 12q20-4 38 14q-22 2-22 18z"/>
</g>
<!-- big foreground cedars with flat layered boughs -->
<g>
  <rect x="146" y="180" width="26" height="300" fill="url(#ftrunk)"/>
  <g fill="#16302a">
    <path d="M159 120l-96 40 96-12 96 12zM159 160l-118 44 118-14 120 14zM159 206l-134 46 134-14 136 14zM159 252l-120 40 120-12 122 12z"/>
  </g>
  <rect x="620" y="150" width="30" height="330" fill="url(#ftrunk)"/>
  <g fill="#16302a">
    <path d="M635 90l-104 42 104-12 106 12zM635 134l-130 46 130-14 132 14zM635 184l-146 48 146-14 148 14zM635 234l-128 42 128-12 130 12z"/>
  </g>
  <!-- Huwawa: a spiral face half-hidden in the canopy -->
  <g stroke="#0d2018" stroke-width="6" fill="none" opacity=".85">
    <path d="M635 150q-20 8-20 24t20 24q26 0 26-26t-28-26"/>
    <circle cx="612" cy="132" r="6" fill="#0d2018" stroke="none"/><circle cx="660" cy="132" r="6" fill="#0d2018" stroke="none"/>
  </g>
</g>
<!-- mist bands -->
<ellipse cx="300" cy="430" rx="280" ry="34" fill="url(#mist)"/>
<ellipse cx="720" cy="450" rx="300" ry="30" fill="url(#mist)"/>
<path d="M0 470h960v70H0z" fill="#101a16"/>
<!-- the two heroes, small against the trunks -->
<g fill="#0d0a10">
  <path d="M360 486l5-44q2-12 10-12t10 12l5 44-7 2-3-20-2 34h-7l-1-34-3 20zM370 428a6 6 0 1 1 .1 0z"/>
  <path d="M406 490l6-50q2-13 11-13t11 13l6 50-8 2-4-24-2 38h-7l-2-38-4 24zM418 424a7 7 0 1 1 .1 0z"/>
  <rect x="436" y="412" width="4" height="76" rx="2"/>
</g>
<g fill="#e0a03a" opacity=".75"><circle cx="230" cy="360" r="2.4"/><circle cx="540" cy="330" r="2"/><circle cx="760" cy="380" r="2.6"/><circle cx="840" cy="300" r="2"/></g>
</svg>
