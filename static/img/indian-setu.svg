<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMid slice"><!-- Refs: Kailash with crescent and Ganga (Shiva); Sudarshana chakra (Vishnu); peacock feather (Krishna); Lanka with ten spires and Setu stones (Ramayana); shikhara temple; lotus (Lakshmi); diyas on the river; marigold petals --><style>
.ch{animation:sp 70s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes sp{to{transform:rotate(360deg)}}
.gn{stroke-dasharray:3 9;animation:fw 3s linear infinite}@keyframes fw{to{stroke-dashoffset:-24}}
.sw{animation:sy 7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes sy{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.pu{animation:pl 5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}@keyframes pl{to{opacity:.45;transform:scale(1.15)}}
.dy{animation:dd 22s ease-in-out infinite alternate}.y2{animation-duration:28s;animation-delay:-8s}.y3{animation-duration:19s;animation-delay:-4s}@keyframes dd{to{transform:translateX(46px)}}
.fl{animation:fk 1.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes fk{to{transform:scale(.8,1.15)}}
.pt{animation:pf 15s linear infinite;opacity:0}.p2{animation-duration:19s;animation-delay:-7s}.p3{animation-duration:23s;animation-delay:-13s}
@keyframes pf{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:.7}100%{transform:translate(50px,300px) rotate(220deg);opacity:0}}
.t0{animation:tw 4s ease-in-out infinite alternate}.t1{animation:tw 6s ease-in-out infinite alternate-reverse}@keyframes tw{to{opacity:.15}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
