<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMid slice"><!-- Japan: hinomaru red + white on night black — Fuji, torii, seigaiha. -->
<style>
.ray{animation:rv 18s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes rv{to{opacity:.4}}
.tw{animation:tw 4s ease-in-out infinite alternate}.t2{animation-delay:-2s}@keyframes tw{to{opacity:.25}}
.wv{animation:wv 7s ease-in-out infinite alternate}.w2{animation-delay:-3s}@keyframes wv{to{transform:translateX(10px)}}
.gl{animation:gl 8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}@keyframes gl{to{opacity:.85;transform:scale(1.05)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0a0a"/><stop offset=".55" stop-color="#141414"/><stop offset="1" stop-color="#1a1012"/></linearGradient>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1a1c" stop-opacity=".95"/><stop offset="1" stop-color="#0c0c0c"/></linearGradient>
<radialGradient id="sun"><stop offset="0" stop-color="#bc002d"/><stop offset=".55" stop-color="#bc002d" stop-opacity=".55"/><stop offset="1" stop-color="#bc002d" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="300" fill="url(#s)"/>
<!-- white stars -->
<g fill="#ffffff"><circle class="tw" cx="80" cy="36" r="1.3"/><circle class="tw t2" cx="210" cy="70" r="1"/><circle class="tw" cx="460" cy="28" r="1.5"/><circle class="tw t2" cx="720" cy="48" r="1.1"/><circle class="tw" cx="980" cy="32" r="1.4"/><circle class="tw t2" cx="1100" cy="78" r="1"/><circle class="tw" cx="340" cy="90" r="1"/><circle class="tw t2" cx="860" cy="60" r="1.2"/></g>
<!-- hinomaru -->
<circle class="gl" cx="600" cy="112" r="78" fill="url(#sun)" opacity=".55"/>
<g class="ray" stroke="#bc002d" stroke-width="1.3" opacity=".32" fill="none" transform="translate(600 112)">
  <path d="M0-48v-42M32-34l30-30M48 0h42M32 34l30 30M0 48v42M-32 34l-30 30M-48 0h-42M-32-34l-30-30"/>
</g>
<circle cx="600" cy="112" r="34" fill="#bc002d"/>
<circle cx="600" cy="112" r="34" fill="none" stroke="#ffffff" stroke-width="2" opacity=".35"/>
<!-- Fuji — black body, white snow -->
<path d="M300 238L510 62L590 62L800 238Z" fill="#101010"/>
<path d="M470 95L510 62L590 62L630 95L590 90L510 90Z" fill="#ffffff" opacity=".92"/>
<path d="M490 100L530 78L550 88L570 76L610 100" fill="none" stroke="#ffffff" stroke-width="1.2" opacity=".35"/>
<path d="M180 238Q360 200 520 238Q680 200 920 238Q1060 212 1200 238V300H0V238Q70 220 180 238Z" fill="#0c0c0c"/>
<!-- vermilion torii -->
<g transform="translate(170 148)" fill="#bc002d">
  <rect x="-4" y="20" width="9" height="72" rx="1"/>
  <rect x="57" y="20" width="9" height="72" rx="1"/>
  <rect x="-18" y="10" width="98" height="10" rx="2"/>
  <rect x="-12" y="28" width="86" height="6" rx="1"/>
</g>
<!-- white seigaiha + red accent waves -->
<g class="wv" fill="none" stroke="#ffffff" stroke-width="1.15" opacity=".28">
  <path d="M0 252q30-22 60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0"/>
</g>
<g class="wv w2" fill="none" stroke="#bc002d" stroke-width="1.2" opacity=".45">
  <path d="M0 268q30-18 60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0"/>
</g>
<rect y="280" width="1200" height="20" fill="url(#sea)"/>
</svg>
