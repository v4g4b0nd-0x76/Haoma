<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Haoma map demos — current vision</title>
  <style>
    :root {
      --bg: #1c1917;
      --ink: #f5f0e8;
      --muted: #a8a29e;
      --rule: #44403c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 2rem 1.5rem 4rem;
      background: var(--bg);
      color: var(--ink);
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin: 0 0 0.35rem;
    }
    .sub {
      color: var(--muted);
      margin: 0 0 2rem;
      font-size: 0.95rem;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2.5rem;
      max-width: 1400px;
      margin: 0 auto;
    }
    @media (min-width: 1100px) {
      .grid { grid-template-columns: 1fr 1fr; }
    }
    figure {
      margin: 0;
      border-top: 1px solid var(--rule);
      padding-top: 1rem;
    }
    figcaption {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
      margin-bottom: 0.75rem;
    }
    figcaption strong { font-size: 1.1rem; }
    figcaption code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.75rem;
      color: var(--muted);
    }
    img {
      width: 100%;
      height: auto;
      display: block;
      background: #0c0a09;
      border: 1px solid var(--rule);
    }
  </style>
</head>
<body>
  <h1>Haoma maps — current render demos</h1>
  <p class="sub">EN SVGs → PNG via cairosvg @1600px wide. Compare to design goals. Not for commit.</p>
  <div class="grid">
    <figure>
      <figcaption><strong>World</strong><code>world.png</code></figcaption>
      <img src="world.png" alt="World map preview" />
    </figure>
    <figure>
      <figcaption><strong>Middle East</strong><code>middle-east.png</code></figcaption>
      <img src="middle-east.png" alt="Middle East map preview" />
    </figure>
    <figure>
      <figcaption><strong>Persia</strong><code>persia.png</code></figcaption>
      <img src="persia.png" alt="Persia map preview" />
    </figure>
    <figure>
      <figcaption><strong>India</strong><code>india.png</code></figcaption>
      <img src="india.png" alt="India map preview" />
    </figure>
    <figure>
      <figcaption><strong>Aegean</strong><code>aegean.png</code></figcaption>
      <img src="aegean.png" alt="Aegean map preview" />
    </figure>
    <figure>
      <figcaption><strong>Scandinavia</strong><code>scandinavia.png</code></figcaption>
      <img src="scandinavia.png" alt="Scandinavia map preview" />
    </figure>
  </div>
</body>
</html>
