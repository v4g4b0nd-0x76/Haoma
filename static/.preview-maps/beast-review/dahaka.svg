<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" width="320" height="400" role="img" aria-label="Zahhak — Shahnameh">
  <defs>
    <radialGradient id="gnd" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#141210"/><stop offset="100%" stop-color="#0a0908"/>
    </radialGradient>
    <linearGradient id="skinL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a3c32"/><stop offset="55%" stop-color="#2e261f"/><stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <linearGradient id="skinR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c4a3e"/><stop offset="100%" stop-color="#2e261f"/>
    </linearGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d342c"/><stop offset="40%" stop-color="#2a2420"/><stop offset="100%" stop-color="#1a1614"/>
    </linearGradient>
    <linearGradient id="snL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3028"/><stop offset="50%" stop-color="#1c1814"/><stop offset="100%" stop-color="#0e0c0a"/>
    </linearGradient>
    <linearGradient id="snR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#423830"/><stop offset="50%" stop-color="#221c18"/><stop offset="100%" stop-color="#100e0c"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>
  <rect width="320" height="400" fill="url(#gnd)"/>
  <text x="160" y="28" text-anchor="middle" fill="#8a8074" font-family="Georgia,serif" font-size="11" letter-spacing=".12em">ZAHHAK</text>
  <text x="160" y="44" text-anchor="middle" fill="#5a5248" font-family="Georgia,serif" font-size="8">Shahnameh — man with two snakes</text>

  <!-- ground shadow -->
  <ellipse cx="160" cy="368" rx="58" ry="10" fill="#000" opacity=".55" filter="url(#soft)"/>

  <!-- lower robe / legs suggestion -->
  <path d="M118 300 C120 340 130 358 148 362 L172 362 C190 358 200 340 202 300 Z" fill="url(#robe)" stroke="#0a0908" stroke-width=".8"/>
  <path d="M130 310 L136 355 M190 310 L184 355" fill="none" stroke="#0a0908" stroke-width=".5" opacity=".5"/>
  <path d="M140 320 Q160 328 180 320" fill="none" stroke="#8a8074" stroke-width=".4" opacity=".35"/>

  <!-- torso -->
  <path d="M122 168 C118 200 120 250 128 298 L192 298 C200 250 202 200 198 168
           C188 158 172 154 160 154 C148 154 132 158 122 168 Z" fill="url(#robe)" stroke="#0a0908" stroke-width=".9"/>
  <!-- robe folds -->
  <path d="M140 175 Q145 230 142 290 M160 170 Q158 240 160 295 M180 175 Q175 230 178 290"
        fill="none" stroke="#0a0908" stroke-width=".55" opacity=".65"/>
  <path d="M134 200 Q160 210 186 200" fill="none" stroke="#8a8074" stroke-width=".35" opacity=".3"/>
  <!-- belt -->
  <path d="M126 248 H194" fill="none" stroke="#0a0908" stroke-width="2.2"/>
  <path d="M126 248 H194" fill="none" stroke="#8a8074" stroke-width=".6" opacity=".45"/>
  <circle cx="160" cy="248" r="3.2" fill="#1a1614" stroke="#8a8074" stroke-width=".5"/>

  <!-- arms -->
  <path d="M122 175 C100 190 92 220 98 255 C100 268 110 272 118 260 C112 240 114 210 124 188 Z"
        fill="url(#skinL)" stroke="#0a0908" stroke-width=".75"/>
  <path d="M198 175 C220 190 228 220 222 255 C220 268 210 272 202 260 C208 240 206 210 196 188 Z"
        fill="url(#skinR)" stroke="#0a0908" stroke-width=".75"/>
  <!-- arm muscle lines -->
  <path d="M108 200 Q105 230 110 250 M212 200 Q215 230 210 250" fill="none" stroke="#0a0908" stroke-width=".45" opacity=".5"/>
  <!-- hands -->
  <path d="M100 255 C96 262 100 270 108 268 L116 262 C112 256 106 254 100 255 Z" fill="#2e261f" stroke="#0a0908" stroke-width=".6"/>
  <path d="M220 255 C224 262 220 270 212 268 L204 262 C208 256 214 254 220 255 Z" fill="#4a3c32" stroke="#0a0908" stroke-width=".6"/>

  <!-- neck -->
  <path d="M148 138 L148 158 L172 158 L172 138 Q160 142 148 138 Z" fill="url(#skinL)" stroke="#0a0908" stroke-width=".7"/>
  <path d="M152 145 H168" fill="none" stroke="#0a0908" stroke-width=".4" opacity=".4"/>

  <!-- head -->
  <ellipse cx="160" cy="112" rx="28" ry="32" fill="url(#skinL)" stroke="#0a0908" stroke-width=".9"/>
  <!-- face shade -->
  <path d="M160 88 C175 90 186 105 184 122 C182 135 172 142 160 144 Z" fill="#1a1410" opacity=".35"/>
  <!-- brow / nose / mouth -->
  <path d="M142 105 Q160 100 178 105" fill="none" stroke="#0a0908" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M160 108 L158 122 Q160 126 162 122 Z" fill="#2e261f" stroke="#0a0908" stroke-width=".45"/>
  <path d="M148 132 Q160 138 172 132" fill="none" stroke="#0a0908" stroke-width=".7" stroke-linecap="round"/>
  <path d="M152 133 Q160 136 168 133" fill="none" stroke="#6a1414" stroke-width=".45" opacity=".7"/>
  <!-- eyes -->
  <ellipse cx="148" cy="112" rx="4.2" ry="3.2" fill="#0a0908"/>
  <ellipse cx="172" cy="112" rx="4.2" ry="3.2" fill="#0a0908"/>
  <circle cx="149.2" cy="111.5" r="1.3" fill="#6a1414"/>
  <circle cx="173.2" cy="111.5" r="1.3" fill="#6a1414"/>
  <circle cx="148.6" cy="110.8" r=".45" fill="#b8aea0" opacity=".7"/>
  <circle cx="172.6" cy="110.8" r=".45" fill="#b8aea0" opacity=".7"/>
  <!-- crown / diadem (simple, bone, not gold) -->
  <path d="M136 92 Q160 78 184 92 L180 98 Q160 88 140 98 Z" fill="#1a1614" stroke="#8a8074" stroke-width=".7"/>
  <path d="M148 86 L150 78 L152 86 M160 84 L160 74 L160 84 M168 86 L170 78 L172 86"
        fill="none" stroke="#b8aea0" stroke-width=".7" stroke-linejoin="round"/>
  <!-- hair / beard hint -->
  <path d="M134 100 C128 120 130 140 142 148 M186 100 C192 120 190 140 178 148"
        fill="none" stroke="#0a0908" stroke-width="1.2" opacity=".5"/>
  <path d="M150 140 Q160 148 170 140" fill="none" stroke="#2a2420" stroke-width="1.4" stroke-linecap="round" opacity=".8"/>

  <!-- ===== LEFT SNAKE (shoulder) ===== -->
  <!-- shoulder join -->
  <ellipse cx="118" cy="168" rx="14" ry="10" fill="#2e261f" stroke="#0a0908" stroke-width=".6"/>
  <!-- coiled body from shoulder -->
  <path d="M118 162
           C100 150 88 138 82 120
           C76 100 84 88 98 92
           C110 96 112 110 104 118
           C96 126 86 122 84 112
           C82 100 92 94 102 100
           C112 106 108 120 96 128
           C84 136 78 148 88 158
           C96 166 110 168 118 162 Z"
        fill="url(#snL)" stroke="#0a0908" stroke-width=".85" stroke-linejoin="round"/>
  <!-- scale rows left -->
  <g fill="none" stroke="#8a8074" stroke-width=".35" opacity=".45">
    <path d="M90 156 Q100 150 108 146"/>
    <path d="M86 148 Q96 142 104 138"/>
    <path d="M84 138 Q94 132 102 128"/>
    <path d="M88 120 Q98 116 106 114"/>
    <path d="M92 108 Q100 106 108 108"/>
    <path d="M96 98 Q102 100 106 104"/>
  </g>
  <g fill="none" stroke="#0a0908" stroke-width=".4" opacity=".55">
    <path d="M94 152 L98 148 M90 144 L96 138 M88 132 L94 126 M92 118 L98 114"/>
  </g>
  <!-- left snake head -->
  <path d="M96 96 C90 88 92 78 102 74 C110 72 116 78 114 88 C112 96 104 100 96 96 Z"
        fill="url(#snL)" stroke="#0a0908" stroke-width=".8"/>
  <path d="M102 78 L108 70 M108 80 L116 74" fill="none" stroke="#b8aea0" stroke-width=".7" stroke-linecap="round"/>
  <circle cx="106" cy="84" r="1.8" fill="#6a1414"/>
  <circle cx="106.5" cy="83.5" r=".5" fill="#b8aea0" opacity=".8"/>
  <path d="M100 90 L114 88" fill="none" stroke="#0a0908" stroke-width=".55"/>
  <path d="M112 86 L120 84 M112 90 L120 92" fill="none" stroke="#3a0c0c" stroke-width=".5" stroke-linecap="round"/>
  <!-- tongue -->
  <path d="M114 88 L122 86 M114 88 L122 90" fill="none" stroke="#6a1414" stroke-width=".45"/>

  <!-- ===== RIGHT SNAKE ===== -->
  <ellipse cx="202" cy="168" rx="14" ry="10" fill="#4a3c32" stroke="#0a0908" stroke-width=".6"/>
  <path d="M202 162
           C220 150 232 138 238 120
           C244 100 236 88 222 92
           C210 96 208 110 216 118
           C224 126 234 122 236 112
           C238 100 228 94 218 100
           C208 106 212 120 224 128
           C236 136 242 148 232 158
           C224 166 210 168 202 162 Z"
        fill="url(#snR)" stroke="#0a0908" stroke-width=".85" stroke-linejoin="round"/>
  <g fill="none" stroke="#8a8074" stroke-width=".35" opacity=".45">
    <path d="M230 156 Q220 150 212 146"/>
    <path d="M234 148 Q224 142 216 138"/>
    <path d="M236 138 Q226 132 218 128"/>
    <path d="M232 120 Q222 116 214 114"/>
    <path d="M228 108 Q220 106 212 108"/>
    <path d="M224 98 Q218 100 214 104"/>
  </g>
  <g fill="none" stroke="#0a0908" stroke-width=".4" opacity=".55">
    <path d="M226 152 L222 148 M230 144 L224 138 M232 132 L226 126 M228 118 L222 114"/>
  </g>
  <path d="M224 96 C230 88 228 78 218 74 C210 72 204 78 206 88 C208 96 216 100 224 96 Z"
        fill="url(#snR)" stroke="#0a0908" stroke-width=".8"/>
  <path d="M218 78 L212 70 M212 80 L204 74" fill="none" stroke="#b8aea0" stroke-width=".7" stroke-linecap="round"/>
  <circle cx="214" cy="84" r="1.8" fill="#6a1414"/>
  <circle cx="214.5" cy="83.5" r=".5" fill="#b8aea0" opacity=".8"/>
  <path d="M220 90 L206 88" fill="none" stroke="#0a0908" stroke-width=".55"/>
  <path d="M208 86 L200 84 M208 90 L200 92" fill="none" stroke="#3a0c0c" stroke-width=".5" stroke-linecap="round"/>
  <path d="M206 88 L198 86 M206 88 L198 90" fill="none" stroke="#6a1414" stroke-width=".45"/>

  <!-- blood / wound marks at snake roots (Shahnameh: snakes grew from kisses) -->
  <path d="M112 164 Q118 160 124 164" fill="none" stroke="#3a0c0c" stroke-width="1.2" opacity=".75"/>
  <path d="M196 164 Q202 160 208 164" fill="none" stroke="#3a0c0c" stroke-width="1.2" opacity=".75"/>

  <text x="160" y="392" text-anchor="middle" fill="#4a4440" font-family="Georgia,serif" font-size="7">review #1 — not on map until approved · no UI gold</text>
</svg>
